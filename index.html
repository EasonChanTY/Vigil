<body>
<div class="vig"></div><div class="sanvig"></div>
<div id="app"></div>
<div id="fx"></div><div id="fl"></div><div id="toast"></div>
<script>
function $(id){return document.getElementById(id)}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var TT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(function(){t.classList.remove('on')},1700)}
function flash(c){var f=$('fl');f.style.background=c==='g'?'radial-gradient(circle at 50% 44%,rgba(255,246,214,.9),rgba(232,196,106,.35) 42%,transparent 72%)':'radial-gradient(circle at 50% 45%,rgba(255,120,90,.85),rgba(160,20,15,.5) 45%,transparent 74%)';f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function shake(){document.body.animate([{transform:'translateX(0)'},{transform:'translateX(-4px)'},{transform:'translateX(5px)'},{transform:'translateX(-2px)'},{transform:'translateX(0)'}],{duration:190})}
/* 图片多路径自动尝试 */
function bindImg(img){
 var base=img.getAttribute('data-b');
 var list=['img/'+base+'.png','img/'+base+'.jpg','img/'+base+'.PNG',
           base+'.png',base+'.jpg',base+'.PNG','img/'+base+'.jpeg',base+'.jpeg'];
 var i=0;
 img.onerror=function(){i++;if(i<list.length)img.src=list[i];else{img.style.display='none'}};
 img.onload=function(){img.style.opacity='1'};
 img.src=list[0];
}
/* 音频 */
var AC=null,MG=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.45;MG.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function V(o){var c=ac();if(!c)return;var t=c.currentTime+(o.d||0);var g=c.createGain();g.connect(MG);var S=[];
 if(o.n){var n=Math.floor(c.sampleRate*o.dur),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);
  for(var i=0;i<n;i++)x[i]=Math.random()*2-1;var s=c.createBufferSource();s.buffer=b;
  var f=c.createBiquadFilter();f.type=o.filt||'lowpass';f.frequency.value=o.cut||1200;s.connect(f);f.connect(g);S.push(s)}

  +'<ellipse cx="150" cy="150" rx="72" ry="44" fill="#0a0710" stroke="'+col+'" stroke-opacity=".5" stroke-width="1.2"/>'
  +'<ellipse class="pulse" cx="150" cy="150" rx="13" ry="35" fill="'+col+'" fill-opacity=".8"/>'
  +'<ellipse cx="150" cy="150" rx="5" ry="29" fill="#05030a"/></svg>';
}
function render(){
 document.body.classList.toggle('insane',G.san<30);
 if(VIEW==='title')return renderTitle();
 if(VIEW==='pick')return renderPick();
 if(VIEW==='map')return renderMap();
 if(VIEW==='fight')return renderFight();
 if(VIEW==='reward')return renderReward();
}
function renderTitle(){
 $('app').innerHTML='<div class="title">'
 +'<div class="thero"><img data-b="hero" alt="" style="opacity:0"></div>'
 +'<div class="tglow"></div>'
 +'<div class="tmain">守夜人</div>'
 +'<div class="ten">T H E &nbsp; L A S T &nbsp; V I G I L</div>'
 +'<div class="ten2">FIFTY FLOORS · ONE CANDLE</div>'
 +'<div class="ttag">每一层都有人停在那里。<br>你要去关上门。</div>'
 +'<button class="tbtn" data-a="start">点燃烛火</button>'
 +'<button class="tbtn" data-a="help" style="margin-top:10px;padding:11px 34px;font-size:12px;letter-spacing:.24em;background:linear-gradient(#3a3448,#221e2e);color:#d8d0c0;box-shadow:0 0 0 1px #4a4058,0 5px 14px rgba(0,0,0,.7)">怎么玩</button>'
 +(G.best>0?'<div class="ttag" style="margin-top:14px;font-size:11px;color:#7a7490">上次停在 · 第 '+G.best+' 层</div>':'')
 +'<div style="height:34px"></div>'
 +'<div class="tfoot">C O N T A C T &nbsp; 2797800498@qq.com</div></div>';
 bindAll();
}
function renderPick(){
 $('app').innerHTML='<div class="pick"><div class="pt">选 你 的 兵 器</div><div class="ps">它决定你今夜的第一套牌</div>'
 +WEAPONS.map(function(w){return '<button class="wbtn" data-w="'+w.id+'"><span class="wn">'+w.n+'</span><span class="wd">'+w.d+'</span></button>'}).join('')
 +'<button data-a="tomenu" style="margin-top:14px;background:none;border:0;color:#6a6478;font-size:11px;letter-spacing:.2em;padding:12px;width:100%">返回</button></div>';
}
function renderMap(){
 var st=Math.min(30,G.best+1);
 var ci=Math.min(2,Math.floor((st-1)/10));
 var ch=CHAP[ci];
 $('app').innerHTML='<div class="map">'
 +'<div class="mbg"><img data-b="'+ch.bg+'" alt=""></div>'
 +'<div class="mtop"><span>第 '+st+' 层 / 30</span><span>◈ '+G.gold+'</span></div>'
 +'<div style="font-family:\'Songti SC\',serif;font-size:26px;letter-spacing:.2em;color:'+ch.c+';margin-top:14px;text-shadow:0 0 26px rgba(232,200,138,.35);position:relative;z-index:2">'+ch.n+'</div>'
 +'<div class="panel"><div class="prow"><span>生命</span><b style="color:#ffc0b4">'+G.hp+' / '+G.max+'</b></div>'
 +'<div class="hpbar" style="margin:6px 0 10px"><i style="width:'+(G.hp/G.max*100)+'%"></i></div>'
 +'<div class="prow"><span>理智 SAN</span><b style="color:#a8d4ff">'+G.san+' / 100</b></div>'
 +'<div class="sanbar" style="margin:6px 0 4px"><i style="width:'+Math.max(0,G.san)+'%"></i></div>'
 +'<div class="prow" style="border-top:1px solid #2a2438;margin-top:8px;padding-top:10px"><span>牌组</span><b>'+G.deck.length+' 张</b></div></div>'
 +(G.relics.length?'<div style="font-size:11px;color:#a89870;margin-top:14px;line-height:1.9;position:relative;z-index:2">遗物　'+G.relics.map(function(k){return RELICS[k].n}).join(' · ')+'</div>':'')
 +'<div style="flex:1"></div>'
 +'<button class="tbtn" data-a="go" style="padding:14px;width:100%;margin:0">'+(G.best>=30?'已抵达顶层':'继续攀爬')+'</button>'
 +'<div style="display:flex;gap:8px;margin-top:10px">'
 +'<button data-a="help" style="flex:1;padding:11px;border-radius:9px;border:1px solid #3a3248;background:#181420;color:#a8a2b6;font-size:12px">怎么玩</button>'
 +'<button data-a="reset" style="flex:1;padding:11px;border-radius:9px;border:1px solid #3a3248;background:#181420;color:#a8a2b6;font-size:12px">重新开始</button>'
 +'</div></div>';
 bindAll();
}
function renderFight(){
 var orbs='';var nOrb=3+(hasRelic('candle')?1:0);
 for(var i=0;i<nOrb;i++)orbs+='<i class="pip'+(i<B.energy?'':' off')+'"></i>';
 var cnt=B.foes.length;
 var w=cnt===1?250:cnt===2?170:132;
 var foesHtml='';
 for(var j=0;j<B.foes.length;j++){
  var f=B.foes[j];
  foesHtml+='<div class="foe'+(B.target===j?' sel':'')+(f.dead?' dead':'')+'" data-f="'+j+'" style="width:'+w+'px">'
  +'<div class="sig" style="width:'+w+'px;height:'+w+'px">'+foeSVG(f.k,f.hue)
  +'<img data-b="'+f.b+'" alt="" style="display:none"></div>'
  +'<div class="mhp"><i style="width:'+Math.max(0,f.hp/f.max*100)+'%"></i></div>'
  +'<div class="mname">'+f.n+'</div>'
  +'<div class="wk">破绽·'+(f.weak==='a'?'斩':f.weak==='p'?'钝':f.weak==='f'?'火':'守')+'</div></div>';
 }
 var cur=B.foes[B.target]||B.foes[0];
 $('app').innerHTML='<div class="top"><div class="row1">'
 +'<button class="iconbtn" data-a="flee">←</button>'
 +'<div class="hpblock"><div class="hline"><span class="hpnum">'+Math.max(0,G.hp)+'</span><span class="hpmax">/'+G.max+'</span></div>'
 +'<div class="hpbar"><i style="width:'+Math.max(0,G.hp/G.max*100)+'%"></i></div></div>'
 +'<div class="sanblock"><div class="slbl"><span>SAN</span><b>'+Math.max(0,G.san)+'</b></div>'
 +'<div class="sanbar"><i style="width:'+Math.max(0,G.san)+'%"></i></div></div>'
 +'<button class="iconbtn" data-a="help">?</button></div>'
 +'<div class="orbrow">'+orbs+'<span style="margin-left:10px;font-size:9px;letter-spacing:.2em;color:#8a8497">第 '+B.n+' 层</span></div></div>'
 +'<div class="arena">'
 +'<div class="chainbar'+(B.chain>1?' on':'')+'">连锁 '+B.chain+' · ×'+chainMul(B.chain).toFixed(1)+'</div>'
 +'<div class="foes">'+foesHtml+'</div>'
 +'<div class="story">'+(cur?cur.story:'')+'</div></div>'
 +'<div class="bottom"><div class="handrow"><div class="hand">'
 +B.hand.map(function(k,i){
   var c=CARDS[k];var cs=k==='whisper';
   return '<div class="card'+(B.energy<c.c&&!cs?' no':'')+'" data-i="'+i+'">'
   +'<div class="fr"></div><div class="in"><div class="gm">'+(cs?'✖':c.c)+'</div>'
   +'<div class="art '+(c.t||'p')+'"><svg viewBox="0 0 24 24" stroke-width="1.5">'+ICON[c.ic]+'</svg></div>'
   +'<div class="nm">'+c.n+'</div><div class="ds">'+c.d+'</div></div></div>';
  }).join('')
 +'</div><button class="end" data-a="end">结束<br>回合</button></div></div>';
 bindAll();
}
function renderReward(){
 $('app').innerHTML='<div class="reward"><div class="rt">第 '+B.n+' 层 · 通过</div>'
 +'<div class="rs">◈ +'+(10+Math.round(B.n*1.4))+' 金币</div>'
 +(RELIC?'<div class="relic"><div class="rl1">获 得 遗 物</div><div class="rl2">'+RELICS[RELIC].n+'</div><div class="rl3">'+RELICS[RELIC].d+'</div></div>':'')
 +'<div style="text-align:center;font-size:10px;color:#7a7490;margin:22px 0 0;letter-spacing:.26em">选 一 张 牌</div>'
 +'<div class="pickrow">'+(PICKS||[]).map(function(k,i){var c=CARDS[k];
   return '<div class="card" data-a="pick" data-v="'+i+'" style="width:92px;height:134px">'
   +'<div class="fr"></div><div class="in"><div class="gm">'+c.c+'</div>'
   +'<div class="art '+(c.t||'p')+'"><svg viewBox="0 0 24 24" stroke-width="1.5">'+ICON[c.ic]+'</svg></div>'
   +'<div class="nm">'+c.n+'</div><div class="ds">'+c.d+'</div></div></div>'}).join('')
 +'</div><button class="skip" data-a="skip">跳过</button></div>';
}
/* 每次渲染后绑定所有图片 */
function bindAll(){
 var imgs=document.querySelectorAll('img[data-b]');
 for(var i=0;i<imgs.length;i++)bindImg(imgs[i]);
}
function showHelp(){
 var d=document.createElement('div');d.className='mask';
 d.innerHTML='<div class="help"><h2>怎 么 玩</h2>'
 +'<div class="hitem"><b>① 生命（红条）</b><p>归零就死。每过一层回 8 点，Boss 层回满。</p></div>'
 +'<div class="hitem"><b>② 理智 SAN（蓝条）</b><p><b style="color:#ff9a8a">这是第二条命。</b>每次被攻击都掉。低于 35 会抽到「低语」废牌；归零后每回合额外掉血，画面变紫。</p></div>'
 +'<div class="hitem"><b>③ 能量（金球）</b><p>3 点。牌左上角是费用。用完就点右下角结束回合。</p></div>'
 +'<div class="hitem"><b>④ 连锁（核心）</b><p>连续打出<b>同类型</b>牌，伤害递增：第 2 张 ×1.5，第 3 张 ×2，第 4 张起 ×2.5。换类型就断。</p></div>'
 +'<div class="hitem"><b>⑤ 破绽</b><p>怪物下方写着破绽（斩/钝/火/守）。用对应牌打，伤害翻倍。</p></div>'
 +'<div class="hitem"><b>⑥ 多敌人</b><p>点怪物切换目标。</p></div>'
 +'<button class="hclose" id="hc">知道了</button></div>';
 document.body.appendChild(d);
 d.querySelector('#hc').onclick=function(){d.remove();G.helpSeen=true;save()};
}
document.addEventListener('click',function(e){
 ac();
 var t=e.target.closest('[data-a]');
 if(t){
  var a=t.getAttribute('data-a');var v=parseInt(t.getAttribute('data-v'),10);
  if(a==='start'){if(G.best>0||G.seen){go('map')}else{go('pick')}
   if(!G.helpSeen)setTimeout(showHelp,340);return}
  if(a==='help'){showHelp();return}
  if(a==='tomenu'){go('title');return}
  if(a==='go'){startFloor(G.best+1);return}
  if(a==='end'){endTurn();return}
  if(a==='flee'){var d=document.createElement('div');d.className='mask';
   d.innerHTML='<div class="help" style="text-align:center"><h2>离开这一层？</h2><p style="font-size:12px;color:#a8a2b6;line-height:2;margin-top:14px">进度保留，这一层作废。</p>'
    +'<button class="hclose" id="y">离开</button><button id="n" style="margin-top:10px;background:none;border:0;color:#6a6478;font-size:12px;width:100%;padding:10px">继续打</button></div>';
   document.body.appendChild(d);
   d.querySelector('#y').onclick=function(){d.remove();B=null;go('map')};
   d.querySelector('#n').onclick=function(){d.remove()};return}
  if(a==='pick'){var k=PICKS[v];if(k)G.deck.push(k);if(RELIC)G.relics.push(RELIC);save();go('map');return}
  if(a==='skip'){if(RELIC)G.relics.push(RELIC);save();go('map');return}
  if(a==='reset'){var d2=document.createElement('div');d2.className='mask';
   d2.innerHTML='<div class="help" style="text-align:center"><h2>清空全部进度？</h2><p style="font-size:12px;color:#a8a2b6;line-height:2;margin-top:14px">无法恢复。</p>'
    +'<button class="hclose" id="y2" style="background:linear-gradient(#a85a4a,#6a2a20);color:#fff">确认清空</button>'
    +'<button id="n2" style="margin-top:10px;background:none;border:0;color:#6a6478;font-size:12px;width:100%;padding:10px">取消</button></div>';
   document.body.appendChild(d2);
   d2.querySelector('#y2').onclick=function(){d2.remove();G=DEF();save();go('title')};
   d2.querySelector('#n2').onclick=function(){d2.remove()};return}
 }
 var w=e.target.closest('[data-w]');
 if(w){var wid=w.getAttribute('data-w');var wd=null;
  for(var i=0;i<WEAPONS.length;i++)if(WEAPONS[i].id===wid)wd=WEAPONS[i];
  G.weapon=wid;G.deck=wd.deck.slice();G.seen=true;save();go('map');return}
 var fb=e.target.closest('.foe');
 if(fb&&VIEW==='fight'){var idx=parseInt(fb.getAttribute('data-f'),10);
  if(!B.foes[idx].dead){B.target=idx;render()}return}
 var c=e.target.closest('.card');
 if(c&&VIEW==='fight'){playCard(parseInt(c.dataset.i,10));return}
});
render();
</script>
