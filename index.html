<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08080c">
<title>THE LAST VIGIL · 守夜人</title>
<style>
:root{--ink:#08080c;--panel:#14141c;--line:#2c2c3c;--txt:#e9e6dd;--dim:#8a879c;--gold:#d8b46a;--gold2:#f2dda0;--aura:rgba(216,180,106,.10);--serif:"Songti SC","STSong","Source Han Serif SC",Georgia,serif}
body[data-ch="2"]{--gold:#7fc0a0;--gold2:#b8e8d0;--aura:rgba(90,200,150,.10)}
body[data-ch="3"]{--gold:#e08a5a;--gold2:#ffc090;--aura:rgba(230,120,60,.12)}
body[data-ch="4"]{--gold:#9a92c8;--gold2:#d8d0ff;--aura:rgba(140,130,220,.10)}
body[data-ch="5"]{--gold:#e8d9a8;--gold2:#fff8dd;--aura:rgba(255,240,200,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--txt);font:15px/1.5 -apple-system,"PingFang SC",sans-serif;overscroll-behavior:none;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;background:radial-gradient(42% 30% at 50% 30%,var(--aura),transparent 70%);animation:fog 16s ease-in-out infinite alternate;pointer-events:none;z-index:0}
@keyframes fog{from{transform:translate3d(-5%,-3%,0) scale(1)}to{transform:translate3d(5%,3%,0) scale(1.14)}}
body.big{font-size:17px}
body.nomotion::before{animation:none}
body.nomotion *{animation-duration:.001s!important;transition-duration:.001s!important}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:10px 12px 20px;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.btn{background:linear-gradient(#242438,#171722);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-weight:600;text-align:center;letter-spacing:.06em}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn.gold{background:linear-gradient(var(--gold),#9c7a36);color:#19130a;border-color:var(--gold2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.35}
.serif{font-family:var(--serif)}
h1{font-family:var(--serif);font-size:23px;letter-spacing:.14em;margin:8px 0 2px;color:var(--gold2);font-weight:400}
.sub{color:var(--dim);font-size:12px;margin-bottom:8px;letter-spacing:.05em}
.dim{color:var(--dim)}
.logo{width:96px;height:116px;display:block;margin:0 auto}
/* 顶栏 */
.topbar{display:flex;align-items:center;gap:10px;padding:6px 0 10px}
.ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;border:1px solid var(--line);background:radial-gradient(circle at 40% 30%,#232332,#101018);box-shadow:0 0 14px var(--aura)}
.lvrow{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);letter-spacing:.08em}
.xpbar{height:4px;background:#1c1c26;border-radius:2px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7a5c20,var(--gold));transition:width .4s}
.coin{font-family:var(--serif);color:var(--gold2);font-size:14px;white-space:nowrap}
/* 战斗 */
.hud{display:flex;align-items:center;gap:8px;padding:2px 0 4px}
.hpbar{flex:1;height:18px;background:#1a1a24;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--line)}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#5a1a1a,#b03636);transition:width .25s}
.hpbar span{position:absolute;inset:0;text-align:center;font-size:11px;line-height:18px;font-weight:700}
.orbs{display:flex;gap:4px}
.orb{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f8ecc8,#c99b3c);box-shadow:0 0 9px var(--gold);transition:.2s}
.orb.off{background:#22222e;box-shadow:none}
.blockpill{font-size:12px;color:#8fc4e8;font-weight:700}
.bossname{font-family:var(--serif);font-size:12px;letter-spacing:.35em;text-align:center;color:#e0a080;margin-top:2px}
.bossbar{height:10px;background:#171720;border:1px solid #5c2a2a;border-radius:5px;overflow:hidden;margin:2px 0 4px}
.bossbar i{display:block;height:100%;background:linear-gradient(90deg,#4a1212,#a83232,#e0703a);transition:width .25s}
.res{height:4px;background:#181820;border-radius:2px;overflow:hidden;margin:5px 0 2px;border:1px solid #2a2438}
.res i{display:block;height:100%;background:linear-gradient(90deg,#3a3260,#a08ce0);transition:width .25s}
.enemies{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px 0;min-height:150px}
.enemy{width:100px;text-align:center;position:relative;border-radius:12px;padding:6px 4px;transition:.18s;animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.enemy.dead{opacity:.18;filter:grayscale(1)}
.enemy.tap{outline:1px solid var(--gold);outline-offset:2px;box-shadow:0 0 22px var(--aura)}
.enemy .face{font-size:38px;line-height:1.1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.enemy .name{font-size:11px;color:#b3b0c2;margin-top:3px;min-height:15px}
.enemy .ehp{height:6px;background:#1c1c26;border-radius:3px;overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.enemy .ehp i{display:block;height:100%;background:linear-gradient(90deg,#682020,#bc3c3c)}
.enemy .num{font-size:10px;color:#a5a2b4}
.eyes{font-size:9px;letter-spacing:2px;color:var(--gold)}
.intent{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:11px;background:#1b1b26;border:1px solid var(--line);border-radius:7px;padding:1px 7px;white-space:nowrap}
.dmg{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-family:var(--serif);font-size:25px;font-weight:700;color:#ff9070;text-shadow:0 0 12px rgba(255,90,60,.85);animation:pop .9s ease-out forwards;pointer-events:none;z-index:5}
.dmg.crit{color:var(--gold2);font-size:32px}
@keyframes pop{0%{transform:translate(-50%,4px) scale(.75);opacity:0}25%{transform:translate(-50%,-8px) scale(1.16);opacity:1}100%{transform:translate(-50%,-44px) scale(1);opacity:0}}
.hand{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.card{flex:0 0 88px;min-height:114px;border-radius:8px;padding:9px 7px;display:flex;flex-direction:column;justify-content:space-between;position:relative;transition:transform .14s,opacity .14s;background:linear-gradient(165deg,#1a1a26,#101018);border:1px solid #38384a;box-shadow:inset 0 0 20px var(--aura)}
body[data-cb="blood"] .card{background:linear-gradient(165deg,#241420,#120a0e);border-color:#582834}
body[data-cb="star"] .card{background:linear-gradient(165deg,#131c2a,#080b12);border-color:#2c4868}
.card:active{transform:translateY(-6px)}
.card.no{opacity:.4}
.card.played{transform:translateY(-70px) scale(.72);opacity:0}
.card .cn{font-family:var(--serif);font-size:13.5px}
.card .cd{font-size:10px;color:#a7a4ba;line-height:1.35}
.card .cc{position:absolute;top:-6px;left:-6px;width:19px;height:19px;border-radius:50%;background:#262636;border:1px solid var(--line);font-size:10px;font-weight:800;display:grid;place-items:center;color:var(--gold2)}
.card.guide{outline:2px solid var(--gold);outline-offset:2px;animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 26px var(--gold)}}
.card.curse{border-color:#6a2a6a;background:linear-gradient(165deg,#1d0f23,#0c050f)}
.card.curse .cn{color:#c88ad8}
.foot{display:flex;gap:8px;margin-top:auto}
.foot .btn{flex:1}
.log{font-size:11px;color:#75728a;min-height:28px;padding:2px 0;line-height:1.5}
.hint{font-size:11.5px;color:var(--gold2);background:var(--aura);border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin:6px 0;line-height:1.55}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 0}
.lv{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:#12121a;display:grid;place-items:center;font-size:13px;position:relative;font-family:var(--serif)}
.lv.done{background:#15221b;border-color:#385e4c;color:#8bd4a8}
.lv.now{background:linear-gradient(var(--gold),#9c7a36);color:#19130a;border-color:var(--gold2);box-shadow:0 0 18px var(--aura)}
.lv.boss{border-color:#763838}
.lv.lock{opacity:.24}
.lv small{position:absolute;bottom:1px;font-size:7px;letter-spacing:.1em;color:var(--dim)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;align-items:center;border-bottom:1px solid #1f1f2a}
.row:last-child{border-bottom:0}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #1f1f2a}
.item:last-child{border-bottom:0}
.item .nm{font-size:13px}.item .ds{font-size:11px;color:var(--dim)}
.item .pr{margin-left:auto;font-family:var(--serif);color:var(--gold2);font-size:13px;white-space:nowrap}
.tag{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--dim);margin-left:5px}
/* 特效层 */
#flash{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:50}
#flash.on{animation:fl .55s ease-out}
@keyframes fl{0%{opacity:0}18%{opacity:.9}100%{opacity:0}}
/* 角落提示 */
#corner{position:fixed;right:10px;bottom:96px;z-index:70;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;max-width:70vw}
.ctoast{background:rgba(10,10,14,.95);border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:6px;padding:7px 11px;font-size:12px;color:#d8d5c8;animation:cin .3s ease-out both;box-shadow:0 6px 24px rgba(0,0,0,.6)}
.ctoast.out{animation:cout .35s ease-in both}
.ctoast.warn{border-left-color:#d06050;color:#f0c0b8}
.ctoast.good{border-left-color:#6ac08a;color:#c0f0d0}
@keyframes cin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes cout{to{opacity:0;transform:translateX(26px)}}
/* 中心震撼弹窗 */
#center{position:fixed;inset:0;z-index:90;pointer-events:none}
.cwrap{position:fixed;inset:0;background:rgba(2,2,4,.9);display:grid;place-items:center;pointer-events:auto;backdrop-filter:blur(5px);animation:cin2 .35s ease-out}
@keyframes cin2{from{opacity:0}to{opacity:1}}
.cbox{text-align:center;padding:32px 26px;max-width:86vw;animation:cbox .55s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes cbox{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.cbox .ct{font-family:var(--serif);font-size:27px;letter-spacing:.16em;color:var(--gold2);text-shadow:0 0 34px var(--gold)}
.cbox .cs{font-size:12.5px;color:#a8a5b8;margin-top:14px;line-height:1.9;letter-spacing:.06em}
.cbox .ch{font-size:10px;color:#5c5a6e;margin-top:26px;letter-spacing:.3em}
.cwrap.danger .ct{color:#ff9a86;text-shadow:0 0 34px rgba(255,60,40,.9);animation:tpulse 1.4s infinite}
@keyframes tpulse{50%{opacity:.72}}
.cwrap.danger .cbox{animation:cbox .4s both, tshake .5s .4s}
@keyframes tshake{30%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
/* 教程 */
.tut{position:fixed;inset:0;background:rgba(3,3,6,.92);z-index:95;display:grid;place-items:center;padding:24px}
.tutbox{max-width:340px}
.tutpages{font-size:10px;letter-spacing:.3em;color:#5c5a6e;text-align:center;margin-top:20px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(3,3,6,.95);border:1px solid var(--line);border-radius:8px;padding:9px 16px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:100}
.toast.on{opacity:1}
.fin{animation:fin .45s ease-out both}
@keyframes fin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(3px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.shake{animation:shake .42s}
</style>
</head>
<body data-ch="1" data-cb="black">
<div id="app"></div>
<div id="corner"></div>
<div id="center"></div>
<div id="flash"></div>
<div class="toast" id="toast"></div>
<script>
/* ================= 基础 ================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
let TT;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('on'),1500)}
function ctoast(msg,kind){
  const d=document.createElement('div');
  d.className='ctoast '+(kind||'');d.textContent=msg;
  $('corner').appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),380)},2600);
}
let C_CB=null;
function alertCenter(title,sub,kind,cb){
  C_CB=cb||null;
  $('center').innerHTML='<div class="cwrap '+(kind||'')+'" data-a="closecenter"><div class="cbox">'
   +'<div class="ct">'+title+'</div>'+(sub?'<div class="cs">'+sub+'</div>':'')
   +'<div class="ch">点击继续</div></div></div>';
  $('center').style.pointerEvents='auto';
}
function flash(kind){
  const f=$('flash');
  f.style.background = kind==='gold'
   ? 'radial-gradient(circle at 50% 46%,rgba(255,246,214,.9),rgba(216,180,106,.42) 40%,transparent 72%)'
   : 'radial-gradient(circle at 50% 46%,rgba(255,130,100,.78),rgba(165,22,16,.5) 44%,transparent 74%)';
  f.classList.remove('on');void f.offsetWidth;f.classList.add('on');
}
function shakeScreen(){const a=$('app');a.classList.remove('shake');void a.offsetWidth;a.classList.add('shake')}
function buzz(ms){try{if(SET.haptic&&navigator.vibrate)navigator.vibrate(ms||18)}catch(e){}}

/* ================= 音频（代码合成，无外部文件） ================= */
const SET=Object.assign({sfx:true,vol:0.6,music:true,haptic:true,reduce:false,big:false},JSON.parse(localStorage.getItem('vigil_set')||'{}'));
function saveSet(){try{localStorage.setItem('vigil_set',JSON.stringify(SET))}catch(e){}}
const AU={ctx:null,master:null};
function ac(){
  if(!AU.ctx){
    try{
      AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
      AU.master=AU.ctx.createGain();
      AU.master.gain.value=SET.vol;
      AU.master.connect(AU.ctx.destination);
    }catch(e){}
  }
  if(AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume();
  return AU.ctx;
}
function tone(freq,dur,type,vol,slideTo,when){
  if(!SET.sfx)return;
  const c=ac();if(!c)return;
  const t=c.currentTime+(when||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(freq,t);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol||0.18,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AU.master||c.destination);
  o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,cut){
  if(!SET.sfx)return;
  const c=ac();if(!c)return;
  const n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,n,c.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource();s.buffer=buf;
  const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=cut||1400;
  const g=c.createGain();g.gain.value=vol||0.14;
  s.connect(f);f.connect(g);g.connect(AU.master||c.destination);
  s.start();
}
const SFX={
  play(){tone(300,0.08,'square',0.09);noise(0.05,0.05,3000)},
  hit(){tone(92,0.16,'sine',0.22,46);noise(0.1,0.16,900)},
  hurt(){tone(72,0.3,'sawtooth',0.18,34);noise(0.2,0.18,500)},
  block(){tone(1100,0.1,'triangle',0.09,880)},
  whisper(){tone(54,1.1,'sine',0.16,38);tone(81,0.9,'sine',0.05,60)},
  burst(){tone(180,0.5,'sawtooth',0.16,1500);noise(0.4,0.22,3200)},
  boss(){tone(50,0.45,'sine',0.3);tone(50,0.45,'sine',0.3,undefined,0.42)},
  win(){tone(440,0.2,'sine',0.13);tone(554,0.2,'sine',0.13,undefined,0.12);tone(659,0.4,'sine',0.13,undefined,0.24)},
  lose(){tone(330,0.45,'sine',0.15);tone(311,0.7,'sine',0.15,undefined,0.32)},
  draw(){noise(0.06,0.07,4200)},
  level(){tone(880,0.3,'sine',0.1);tone(1320,0.45,'sine',0.08,undefined,0.1)},
  ui(){tone(620,0.05,'sine',0.05)}
};
/* BGM：低频 drone + 缓慢音 */
const BGM={timer:null,on:false};
function bgmStart(){
  if(BGM.on||!SET.music)return;
  const c=ac();if(!c)return;
  BGM.on=true;
  const base=[55,49,58,43,52][Math.max(0,Math.min(4,Math.floor((G.best)/10)))];
  const tick=()=>{
    if(!SET.music){bgmStop();return}
    tone(base,5.5,'sine',0.045);
    tone(base*1.5,4.5,'triangle',0.016);
    if(Math.random()<0.5)tone(base*4,2.4,'sine',0.01);
  };
  tick();
  BGM.timer=setInterval(tick,4200);
}
function bgmStop(){if(BGM.timer)clearInterval(BGM.timer);BGM.timer=null;BGM.on=false}

/* ================= 数据：卡牌 ================= */
const CARDS={
 strike:{n:'打击',c:1,t:'atk',d:'造成 6 点伤害',v:{dmg:6},lv:0},
 defend:{n:'防御',c:1,t:'skl',d:'获得 5 点格挡',v:{blk:5},lv:0},
 whisper:{n:'低语',c:0,t:'curse',d:'无法打出 · 回合结束受 5 伤 +1 易伤',v:{}},
 bash:{n:'猛击',c:2,t:'atk',d:'造成 13 点伤害',v:{dmg:13},lv:1},
 twin:{n:'双刀',c:1,t:'atk',d:'造成 5 点伤害 2 次',v:{dmg:5,hits:2},lv:1},
 wall:{n:'铁壁',c:2,t:'skl',d:'获得 12 点格挡',v:{blk:12},lv:1},
 gale:{n:'疾风',c:0,t:'atk',d:'造成 4 点伤害，抽 1 张',v:{dmg:4,draw:1},lv:1},
 brk:{n:'破防',c:1,t:'atk',d:'造成 8 点伤害，施加 2 易伤',v:{dmg:8,vuln:2},lv:3},
 rack:{n:'蓄力',c:1,t:'pow',d:'力量 +2',v:{str:2},lv:3},
 mend:{n:'包扎',c:1,t:'skl',d:'回复 8 生命（消耗）',v:{heal:8},ex:1,lv:4},
 combo:{n:'连击',c:1,t:'atk',d:'造成 3 点伤害 3 次',v:{dmg:3,hits:3},lv:5},
 whet:{n:'磨刀',c:1,t:'pow',d:'力量 +1，抽 1 张',v:{str:1,draw:1},lv:6},
 ham:{n:'重锤',c:2,t:'atk',d:'造成 19 点伤害，自伤 3',v:{dmg:19,self:3},lv:7},
 cleave:{n:'横扫',c:1,t:'atk',d:'对全体造成 7 点伤害',v:{dmg:7,all:1},lv:8},
 guard:{n:'坚守',c:1,t:'skl',d:'获得 9 格挡，抽 1 张',v:{blk:9,draw:1},lv:9},
 pierce:{n:'穿刺',c:2,t:'atk',d:'造成 15 点伤害，无视格挡',v:{dmg:15,pierce:1},lv:11},
 weaken:{n:'削弱',c:1,t:'skl',d:'施加 2 虚弱，抽 1 张',v:{weak:2,draw:1},lv:12},
 fury:{n:'狂怒',c:1,t:'pow',d:'力量 +3，自伤 2',v:{str:3,self:2},lv:14},
 heavy:{n:'重斩',c:3,t:'atk',d:'造成 26 点伤害',v:{dmg:26},lv:15},

function makeFoes(n){
  const dm=diffMul();
  if(BOSSES[n]){
    const b=BOSSES[n];
    const hp=Math.round(b.hp*dm.hp);
    return [{n:b.n,e:b.e,hp:hp,max:hp,i:0,str:0,blk:0,vuln:0,weak:0,eye:0,burn:0,
      seq:b.seq.map(s=>(s.t==='atk'||s.t==='burn')?{t:s.t,v:Math.max(2,Math.round(s.v*dm.atk))}:s)}];
  }
  const pool=FOES.filter(f=>f.from<=n);
  const count=n<5?1:n<14?(n%2?1:2):n<26?2:n<41?rnd(2,3):3;
  const total=Math.round((22+(n-1)*3.4)*(count===1?1:count===2?0.92:0.85));
  const each=total/count;
  const amul=(1+(n-1)*0.03)/(count===3?1.55:count===2?1.28:1)*dm.atk;
  const out=[];
  for(let i=0;i<count;i++){
    const f=pool[rnd(0,pool.length-1)];
    const hp=Math.max(10,Math.round(each*(0.85+Math.random()*0.3)));
    out.push({n:f.n,e:f.e,hp:hp,max:hp,i:0,str:0,blk:0,vuln:0,weak:0,eye:0,
      seq:f.seq.map(s=>(s.t==='atk'||s.t==='burn')?{t:s.t,v:Math.max(3,Math.round(s.v*amul))}:s)});
  }
  return out;
}

/* ================= 结算 ================= */
function win(){
  if(B.nw){
    B.over=true;
    G.nwRun=(G.nwRun||1);
    G.nwBest=Math.max(G.nwBest||0,G.nwRun);
    save();
    const healed=Math.max(1,Math.round(G.max*0.15));
    G.hp=Math.min(G.max,G.hp+healed);
    const nextRun=G.nwRun+1;
    SFX.win();
    alertCenter('第 '+G.nwRun+' 夜 · 过去了','火光回复 '+healed+'　·　已守 '+G.nwRun+' 夜',null,()=>{
      G.nwRun=nextRun;
      startBattle(0,{nw:true,run:nextRun});
    });
    return;
  }
  const n=G.best+1;
  B.over=true;
  const goldGain=Math.round((BOSSES[n]?35:7+n*0.7)*(G.mode==='abyss'?1.6:1));
  const xpGain=Math.round((BOSSES[n]?40:12)*(G.mode==='abyss'?1.5:1));
  G.gold+=goldGain;addXp(xpGain);
  if(BOSSES[n]){G.max+=5;G.hp=G.max}else{G.max+=2;G.hp=Math.min(G.max,G.hp+6)+(G.mode==='normal'?8:0)}
  G.best=n;save();SFX.win();
  if(n>=50){VIEW='victory';render();return}
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].lv>0&&CARDS[k].lv<=G.best);
  B.rewards=shuffle(pool).slice(0,3);
  B.gain={gold:goldGain,xp:xpGain};
  B.postLore=BOSSES[n]?BOSSES[n].post:null;
  VIEW='reward';render();
}
function lose(){
  if(B&&B.nw){
    SFX.lose();
    const r=G.nwRun||1;
    G.nwBest=Math.max(G.nwBest||0,r);
    if(G.nwSaveHp!=null){G.hp=G.nwSaveHp;G.nwSaveHp=null}
    G.nwRun=0;save();
    alertCenter('守夜到此为止','你守住了 '+r+' 夜　·　最佳纪录 '+G.nwBest+' 夜','danger',()=>{VIEW='map';render()});
    return;
  }
  if(G.items.revive>0&&B&&!B.usedRevive){
    B.usedRevive=true;G.items.revive--;G.hp=Math.max(1,Math.floor(G.max*0.5));
    B.over=false;save();
    SFX.level();flash('gold');
    alertCenter('烛火未灭','你重新站了起来　·　生命 '+(Math.round(G.hp/G.max*100))+'%','gold');
    render();return;
  }
  SFX.lose();save();VIEW='lose';render();
}
function pickCard(i){
  if(!B||!B.rewards)return;
  const k=B.rewards[i];if(!k)return;
  G.deck.push(k);save();SFX.level();
  VIEW='map';render();toast('加入牌组：'+CARDS[k].n);
}
/* ================= 守夜人 ================= */
function startNight(){
  if(G.best<50){ctoast('先通过第 50 层','warn');return}
  G.nwSaveHp=G.hp;G.nwRun=1;
  alertCenter('守 夜 人','没有尽头。只有更深的夜。\n每过一夜，它更强一点。','danger',()=>{
    startBattle(0,{nw:true,run:1});
  });
}

function render(){
  applyTheme();
  if(VIEW==='title')renderTitle();
  else if(VIEW==='intro')renderIntro();
  else if(VIEW==='map')renderMap();
  else if(VIEW==='battle')renderBattle();
  else if(VIEW==='reward')renderReward();
  else if(VIEW==='shop')renderShop();
  else if(VIEW==='settings')renderSettings();
  else if(VIEW==='deck')renderDeck();
  else if(VIEW==='lose')renderLose();
  else if(VIEW==='victory')renderVictory();
  if(VIEW==='battle'&&B&&B.fx&&B.fx.length){
    const q=B.fx;B.fx=[];
    q.forEach(f=>popDmg(f.i,f.v));
  }
}

   +'<div class="sub">回合开始抽 5 张，抽完自动洗回</div>'
   +'<div class="sheet">'+rows+'</div>'
   +'</div>';
}
function renderLose(){
  $('app').innerHTML='<div class="fin" style="flex:1;display:flex;flex-direction:column;justify-content:center">'
   +'<h1 style="color:#b06060">你在第 '+(G.best+1)+' 层停了下来</h1>'
   +'<div class="sub" style="line-height:2">牌组还在。<br>再往上，就是那个东西了。</div>'
   +'<div class="sheet" style="margin-top:12px">'
   +'<div class="row"><span class="dim">已通过</span><b>'+G.best+' 层</b></div>'
   +'<div class="row"><span class="dim">金币</span><b>◈ '+G.gold+'</b></div>'
   +'<div class="row"><span class="dim">等级</span><b>Lv.'+G.lv+'</b></div></div>'
   +'<div class="foot" style="margin-top:16px"><button class="btn gold" data-a="retry">再来一次</button></div>'
   +'<div class="foot" style="margin-top:8px"><button class="btn" data-a="back">返回</button></div>'
   +'</div>';
}

  $('app').innerHTML='<div class="fin" style="flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center">'
   +'<div style="font-size:50px;filter:drop-shadow(0 0 30px var(--gold))">🕯️</div>'
   +'<h1 style="margin-top:12px">门，关上了</h1>'
   +'<div class="sub" style="line-height:2;margin-top:8px">五十层都安静了。<br>你听见自己的心跳，还在门里。</div>'

   +'<div class="foot" style="margin-top:14px"><button class="btn gold" data-a="night">进入守夜人</button></div>'
   +'<div class="foot" style="margin-top:8px"><button class="btn" data-a="back">返回</button></div>'

/* ================= 抽奖 ================= */
function doGacha(){
  if(G.tickets>0)G.tickets--;
  else if(G.gold>=90)G.gold-=90;
  else{toast('金币不足（需要 90）');return}
  G.pity++;
  let pool=GACHA;
  if(G.pity>=10)pool=GACHA.filter(x=>x.k==='skin'||x.k==='item');
  const tot=pool.reduce((s,x)=>s+x.w,0);
  let r=Math.random()*tot,got=pool[0];
  for(const x of pool){r-=x.w;if(r<=0){got=x;break}}
  let n,d;
  if(got.k==='g'){G.gold+=60;n='60 金币';d='聊胜于无'}
  else if(got.k==='g2'){G.gold+=150;n='150 金币';d='不算亏'}
  else if(got.k==='xp'){addXp(45);n='45 经验';d='火光更稳'}
  else if(got.k==='item'){const id=Math.random()<0.5?'draw':'revive';G.items[id]=(G.items[id]||0)+1;n=id==='draw'?'烛火 · 明视':'烛火 · 重生';d='已存入库存'}
  else{
    const all=SHOP.skin.concat(SHOP.cb).filter(x=>x.p>0);
    const locked=all.filter(x=>!(G.owned.skin.includes(x.id)||G.owned.cb.includes(x.id)));
    if(locked.length){
      const it=locked[rnd(0,locked.length-1)];
      const kind=SHOP.skin.some(s=>s.id===it.id)?'skin':'cb';
      G.owned[kind].push(it.id);G.cur[kind]=it.id;
      n='外观 · '+it.n;d='已解锁并换上';G.pity=0;
    }else{G.gold+=120;n='120 金币';d='外观已全部拥有';G.pity=0}
  }
  save();applyTheme();SFX.level();flash('gold');
  alertCenter(n,d,'gold');
  render();
}
/* ================= 交互 ================= */
function buy(kind,id){
  const it=(kind==='skin'?SHOP.skin:SHOP.cb).find(x=>x.id===id);
  if(!it)return;
  if(G.owned[kind].includes(id)){G.cur[kind]=id;save();applyTheme();render();ctoast('已换上 · '+it.n);return}
  if(G.gold<it.p){toast('金币不足（需要 '+it.p+'）');return}
  G.gold-=it.p;G.owned[kind].push(id);G.cur[kind]=id;save();applyTheme();render();
  flash('gold');SFX.level();ctoast('解锁 · '+it.n,'good');
}
document.body.addEventListener('click',function(ev){
  const t=ev.target.closest('[data-a]');
  if(!t)return;
  const a=t.getAttribute('data-a');
  const v=parseInt(t.getAttribute('data-v'),10)||0;
  const k=t.getAttribute('data-k');
  ac();
  if(a==='closecenter'){
    $('center').innerHTML='';$('center').style.pointerEvents='none';
    const cb=C_CB;C_CB=null;if(cb)cb();
    return;
  }
  if(a==='enter'){SFX.ui();if(NEWPLAYER){NEWPLAYER=false;VIEW='intro'}else{VIEW='map'}render();bgmStart();return}
  if(a==='introok'){SFX.ui();VIEW='map';render();return}
  if(a==='go'){
    if(!G.nwSaveHp===null&&G.nwSaveHp!=null){G.nwSaveHp=null}
    startBattle(G.best+1);return;
  }
  if(a==='play'){onCard(v,t);return}
  if(a==='target'){if(B){B.target=v;SFX.ui();render()};return}
  if(a==='end'){endTurn();return}
  if(a==='stance'){switchStance();return}
  if(a==='pick'){pickCard(v);return}
  if(a==='skip'){SFX.ui();VIEW='map';render();return}
  if(a==='shop'){SFX.ui();VIEW='shop';render();return}
  if(a==='gacha'){doGacha();return}
  if(a==='buy'){buy(k,v);return}
  if(a==='deck'){SFX.ui();VIEW='deck';render();return}
  if(a==='back'){SFX.ui();VIEW='map';render();return}
  if(a==='settings'){SFX.ui();VIEW='settings';render();return}
  if(a==='toggle'){
    SET[k]=!SET[k];saveSet();
    if(k==='music'){if(SET.music)bgmStart();else bgmStop()}
    if(k==='reduce'||k==='big')applyTheme();
    render();return;
  }
  if(a==='vol'){SET.vol=v;saveSet();if(AU.master)AU.master.gain.value=v;SFX.ui();render();return}
  if(a==='mode'){G.mode=G.mode==='abyss'?'normal':'abyss';save();SFX.ui();ctoast('模式 · '+(G.mode==='abyss'?'烈烛（更硬）':'烛火（普通）'));render();return}
  if(a==='night'){startNight();return}
  if(a==='retry'){G.hp=G.max;startBattle(G.best+1);return}
  if(a==='reset'){
    if(confirm('确定清空全部进度？金币、等级、纪录都会消失。')){
      G=DEF();B=null;NEWPLAYER=true;save();VIEW='title';render();
    }
    return;
  }
});
/* 首次点击解锁音频 */
document.addEventListener('pointerdown',function once(){ac();document.removeEventListener('pointerdown',once)});
applyTheme();
render();
</script>
