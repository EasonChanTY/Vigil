function V(f0,f1,d,tp,v,wet){
var c=ACf();if(!c||!G.sfx)return;
if(!RV){
RV=c.createConvolver();
var n=Math.floor(c.sampleRate*2),b=c.createBuffer(2,n,c.sampleRate);
for(var ch=0;ch<2;ch++){var x=b.getChannelData(ch);
for(var i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.4)}
RV.buffer=b;
var wg=c.createGain();wg.gain.value=.55;RV.connect(wg);wg.connect(MG);
}
var t=c.currentTime,o=c.createOscillator(),g=c.createGain();
o.type=tp||'sine';
o.frequency.setValueAtTime(f0,t);
if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
g.gain.setValueAtTime(.0001,t);
g.gain.linearRampToValueAtTime(v||.16,t+.008);
g.gain.exponentialRampToValueAtTime(.0001,t+d);
o.connect(g);g.connect(MG);
if(wet){var w2=c.createGain();w2.gain.value=wet;g.connect(w2);w2.connect(RV)}
o.start(t);o.stop(t+d+.05);
}

function chk(){return ACf()}

function ambStart(){
var c=chk();if(!c||AMB.on)return;
AMB.on=true;
var m=c.createGain();m.gain.value=0;m.connect(MG);
m.gain.linearRampToValueAtTime(.13,c.currentTime+5);
AMB.master=m;
function osc(f,tp,g0){
var o=c.createOscillator();o.type=tp;o.frequency.value=f;
var g=c.createGain();g.gain.value=g0;
o.connect(g);g.connect(m);o.start();AMB.nodes.push(o);
return o;
}
osc(55,'sine',.55);
osc(58.27,'sine',.32);
osc(27.5,'triangle',.42);
osc(110,'sine',.1);
var lfo=c.createOscillator();lfo.frequency.value=.055;
var lg=c.createGain();lg.gain.value=.06;
lfo.connect(lg);lg.connect(m.gain);lfo.start();AMB.nodes.push(lfo);
var lfo2=c.createOscillator();lfo2.frequency.value=.13;
var lg2=c.createGain();lg2.gain.value=.03;
lfo2.connect(lg2);lg2.connect(m.gain);lfo2.start();AMB.nodes.push(lfo2);
AMB.t1=setInterval(function(){if(AMB.on)ambHit()},3800);
AMB.t2=setInterval(function(){
if(!AMB.on)return;
if(AMB.master)AMB.master.gain.value=G.sfx?(G.bgm?.13:0):0;

function startFloor(n){
G.max=44+HPM()+(G.upg.hp||0)*3;
if(G.hp>G.max)G.hp=G.max;
var isB=!!BS[n];
var cnt=isB?1:(n<4?1:n<10?2:n<20?R(1,2):n<26?2:R(2,3));
var m=1+(n-1)*(isB?0.075:0.1);
var foes=[];
if(isB){foes.push(mk(BS[n],m))}
else{for(var i=0;i<cnt;i++){var t=F[R(0,F.length-1)];
foes.push(mk(t,m*(cnt===1?1:cnt===2?0.62:0.46)));G.dexF[t.n]=1}}
B={n:n,boss:isB,foes:foes,tg:0,en:3,turn:1,ch:0,ct:'',over:false,lock:false,
hand:[],draw:SH(G.deck),disc:[],pb:(G.upg.blk||0),str:0};
dN(5+(HR('sand')?1:0)+(G.weapon==='wand'?1:0));
if(isB){S.boss();FL('r');SK()}
ambStart();
go('fight');
if(!G.tut)setTimeout(tutStart,700);
}

function endTurn(){
if(!B||B.over||B.lock)return;
if(B.foes.some(function(f){return f.ch&&!f.dead})){tension()}
var ws=0;for(var i=0;i<B.hand.length;i++)if(B.hand[i]==='whisper')ws++;
if(ws){G.san-=5*ws;T('低语 · 理智 -'+(5*ws));S.whisper()}
B.hand=[];var pen=0;
for(var j=0;j<B.foes.length;j++){
var f=B.foes[j];if(f.dead)continue;
if(f.pv==='armor')f.blk=(f.blk||0)+7;
if(f.pv==='regen')f.hp=Math.min(f.max,f.hp+5);
if(f.pv==='drain')pen=1;
f.tick=(f.tick||0)+1;
var ult=false;
if(f.ch){ult=true;f.ch=false;f.tick=0}
else if(f.tick>=4){f.ch=true;S.charge();T(f.n+' 正在蓄力！');continue}
var times=(f.pv==='swift')?2:1;
for(var tt=0;tt<times;tt++){
var raw=f.atk+((f.wd||0)>0?-3:0);
if(ult)raw=Math.round(raw*1.8);
if(times===2)raw=Math.round(raw*0.6);
var ab=Math.min(B.pb,raw);B.pb-=ab;raw-=ab;
if(raw>0){G.hp-=raw;var s2=S[f.snd];if(s2)s2();else S.hurt();
FL('r');SK();
var hr=document.querySelector('.hr');if(hr){hr.classList.add('hit');setTimeout(function(){hr.classList.remove('hit')},180)}}
}
if(ult){S.ult();FL('r');SK();T(f.n+' 重击！')}
f.blk=0;
if(f.pv==='wail'&&f.tick%3===0){if(B.hand.length<8){B.hand.push('whisper');S.whisper()}}
if(f.burn>0){f.hp-=f.burn;f.burn--;if(f.hp<=0)f.dead=true}
if(f.wd>0)f.wd--;
}
var bs=3+Math.floor(B.n*0.12);
if(HR('mask'))bs=Math.round(bs*0.6);
G.san-=bs;if(G.san<0)G.san=0;
B.pb=0;
if(G.san<=0){G.hp-=6;T('理智耗尽 · 生命 -6')}
if(G.hp<=0){B.over=true;setTimeout(lose,280);return}
if(alive().length===0){B.over=true;setTimeout(winF,280);return}
B.en=Math.max(1,3+(HR('candle')?1:0)-pen);B.turn++;
dN((HR('candle')?4:5)+(G.weapon==='wand'?1:0));
T('新回合 · 抽 '+((HR('candle')?4:5)+(G.weapon==='wand'?1:0))+' 张 · 理智 -'+bs);
if(G.hp/G.max<0.3)setTimeout(function(){heart(.18)},300);
render();
}

function PC(i){
if(!B||B.over||B.lock)return;
var k=B.hand[i];if(!k)return;
if(k==='whisper'){if(B.en<1){T('需要 1 能量');return}
B.en--;B.hand.splice(i,1);B.disc.push('whisper');T('撕毁了低语');render();return}
var c=C[k];if(B.en<c.c){T('能量不足');return}
var tf=tgt();
B.lock=true;B.en-=c.c;S.play();render();
var el=document.querySelector('.card[data-i="'+i+'"]');if(el)el.style.opacity='0';
setTimeout(function(){
B.hand.splice(i,1);
var cm=CM(B.ch),wk=(tf&&c.t===tf.w)?2:1,am=0;
if(c.rand){
var d=Math.max(1,Math.round(R(1,28)*cm));
setTimeout(function(){if(B.foes[B.tg]){HF(B.tg,d,2);var p=FR(B.tg);SLA(p.x,p.y)}S.hit()},140);
am=220;
}else if(c.coin){
var win=Math.random()<0.5;
setTimeout(function(){
if(win){if(B.foes[B.tg])HF(B.tg,40,3);S.crit();FL('g')}
else{G.hp-=8;S.hurt();T('赌输了 · 自伤 8')}
},140);
am=280;
}else{
if(G.weapon==='dagger'&&c.c===0){}
else if(c.t===B.ct)B.ch++;else B.ch=1;
B.ct=c.t;
if(c.dmg){
var ti=B.tg,base=c.dmg+B.str+(HR('blood')?2:0)+DM();
if(c.t==='f'&&HR('ember'))base+=3;
var d2=Math.max(1,Math.round(base*cm*wk)),hs=c.hits||1;
for(var h=0;h<hs;h++){(function(k2){setTimeout(function(){
if(B.foes[ti]){var one=Math.round(d2/hs);HF(ti,one,wk>1?3:(B.ch>=4?3:B.ch>=2?2:1));
if(k2===0){var p=FR(ti);SLA(p.x,p.y)}}S.hit();},k2*90)})(h)}
am=hs*90;if(wk>1)T('击中破绽！×2');
}
if(c.dmgAll){for(var q=0;q<B.foes.length;q++){if(!B.foes[q].dead){HF(q,Math.round((c.dmgAll+B.str)*cm),2);am+=80}}}
if(c.blk){B.pb+=c.blk+(HR('iron')?2:0)+(G.weapon==='shield'?3:0);S.block()}
if(c.pow)B.str+=c.pow;
if(c.heal)G.hp=Math.min(G.max,G.hp+c.heal);
if(c.self)G.hp-=c.self;
if(c.burn&&tf)tf.burn=(tf.burn||0)+c.burn;
if(c.burnAll)B.foes.forEach(function(f){if(!f.dead)f.burn=(f.burn||0)+c.burnAll});
if(c.draw)dN(c.draw);
if(c.weak&&tf)tf.wd=(tf.wd||0)+c.weak;
B.disc.push(k);G.dexC[k]=1;
if(B.ch>=3)FL('g');
if(c.q>=4){S.epic();FL('g')}
}
setTimeout(function(){
B.lock=false;
if(alive().length===0){B.over=true;setTimeout(winF,170);return}
if(G.hp<=0){B.over=true;setTimeout(lose,170);return}
render();
},am+260);
},140);
}

G.potions[k]=n2-1;

S.coin();SAVE();render();
}

/* —— 处理新按钮 —— */
document.addEventListener('click',function(e){
var t=e.target.closest('[data-a]');if(!t)return;
var a=t.getAttribute('data-a'),v=parseInt(t.getAttribute('data-v'),10),k=t.getAttribute('data-k');
if(a==='next'){
  if(NW&&NW.daily){NW=null;G.gold+=150;SAVE();T('每日挑战完成 · +150 金币');go('home');return}
  if(G.best>=50){go('home');T('你抵达了第五十层');return}
  if(G.best===15||G.best===25||G.best===35||G.best===45){showEvent();return}
  PICKS=rollR();rollRel();go('reward');return;
}
if(a==='ev'){
  var ms=document.querySelectorAll('.mask');for(var i=0;i<ms.length;i++)ms[i].remove();
  if(v===0){G.hp-=6;var pool=[];for(var kk in C){if(C[kk].q>=3)pool.push(kk)}
    var got=pool[R(0,pool.length-1)];G.deck.push(got);G.dexC[got]=1;SAVE();T('获得：'+C[got].n)}
  if(v===1){G.gold+=90;G.san=Math.max(0,G.san-12);SAVE();T('+90 金币 · 理智 -12')}
  if(v===2){G.hp=Math.min(G.max,G.hp+10);SAVE();T('回复 10 生命')}
  PICKS=rollR();rollRel();go('reward');return;
}
if(a==='usePot'){usePot(k);return}
if(a==='buyPot'){
  var it=null;for(var j=0;j<POT.length;j++)if(POT[j].k===k)it=POT[j];
  if(!it)return;
  if(G.gold<it.p){T('金币不足');return}
  G.gold-=it.p;G.potions[k]=(G.potions[k]||0)+1;S.coin();SAVE();render();return;
}
if(a==='daily'){
  if(G.lastDaily===TODAY()){T('今天已经打过了');return}
  if(!G.picked){T('先去闯关选一把武器');return}
  startDaily();return;
}
});
