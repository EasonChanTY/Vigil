<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050408">
<title>守夜人</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;font-family:-apple-system,"PingFang SC",sans-serif;color:#f2ecdd;
background:radial-gradient(58% 40% at 50% 26%,#1a1224,#08060e 58%,#020104 88%)}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;overflow:hidden}
.fadeov{position:fixed;inset:0;background:#020104;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.fadeov.on{opacity:1}
/* ===== 主菜单 ===== */
.home{flex:1;display:flex;flex-direction:column;padding:16px 18px;position:relative;overflow:hidden}
#eyefield{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.epop{position:absolute;display:flex;gap:6px;align-items:center;opacity:0;animation:epop 5s ease-in-out forwards;
filter:drop-shadow(0 0 10px rgba(255,235,190,.9))}
.epop i{display:block;background:#fff;border-radius:50%;
box-shadow:0 0 8px 3px rgba(255,244,214,.95),0 0 20px 8px rgba(255,205,130,.4)}
@keyframes epop{0%{opacity:0;transform:scale(.8)}14%{opacity:.92;transform:scale(1)}
42%{opacity:.8}50%{opacity:.08;transform:scaleY(.08)}57%{opacity:.88;transform:scale(1)}
100%{opacity:0;transform:scale(.92)}}
.hdr{display:flex;align-items:center;gap:12px;position:relative;z-index:2;padding-top:4px}
.ava{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;
border:2px solid rgba(232,200,138,.55);background:radial-gradient(circle at 35% 30%,#2c2438,#12101a);
box-shadow:0 0 20px rgba(232,200,138,.25),inset 0 1px 2px rgba(255,255,255,.2)}
.hinfo{flex:1}
.nick{font-family:"Songti SC",serif;font-size:16px;letter-spacing:.1em;color:#f2e6c8}
.hsub{font-size:10px;color:#8a8497;margin-top:3px;letter-spacing:.06em}
.gear{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;
background:#1a1622;border:1px solid #3a3248;color:#c8c0b0}
.gear:active{background:#2a2434}
.hmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2}
.htitle{font-family:"Songti SC",serif;font-size:44px;letter-spacing:.24em;text-indent:.24em;
background:linear-gradient(180deg,#fffdf5,#f6e6bc 28%,#b8924a 58%,#fff6d8 88%);
-webkit-background-clip:text;background-clip:text;color:transparent;
filter:drop-shadow(0 4px 16px rgba(232,200,138,.5))}
.hen{font-size:9px;letter-spacing:.46em;text-indent:.46em;color:#a09889;margin-top:12px}
.hmenu{width:100%;max-width:340px;margin-top:auto;padding-bottom:14px;position:relative;z-index:2}
.mbtn{display:block;width:100%;padding:16px;border-radius:12px;text-align:center;margin-bottom:10px;
font-family:"Songti SC",serif;font-size:16px;letter-spacing:.2em;border:1px solid #4a3f5c;color:#f6e8c4;
background:linear-gradient(160deg,#2a2338,#161220);
box-shadow:inset 0 1px 0 rgba(255,240,200,.12),0 6px 16px rgba(0,0,0,.7)}
.mbtn:active{transform:scale(.98);filter:brightness(1.2)}
.mbtn.gold{background:radial-gradient(circle at 34% 26%,#fffef6,#f8e8bc 28%,#e2c47e 54%,#a8823a 78%,#6a4f16);
color:#1a1305;font-weight:700;border-color:#f6e6bb;
box-shadow:0 0 0 1px #2a1c06,0 0 30px rgba(232,200,138,.45),0 6px 16px rgba(0,0,0,.8),
inset 0 2px 2px rgba(255,255,255,.9)}
.mrow{display:flex;gap:10px;margin-bottom:10px}
.mrow .mbtn{margin-bottom:0;flex:1;padding:14px;font-size:14px;letter-spacing:.14em}
.badge{position:relative}
.badge::after{content:"";position:absolute;top:8px;right:12px;width:8px;height:8px;border-radius:50%;
background:#e04a34;box-shadow:0 0 8px #e04a34}
/* ===== 通用页面 ===== */
.page{flex:1;display:flex;flex-direction:column;padding:14px 16px;overflow-y:auto}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex:0 0 auto}
.back{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;
background:#1a1622;border:1px solid #3a3248;color:#c8c0b0}
.back:active{background:#2a2434}
.ptitle{font-family:"Songti SC",serif;font-size:20px;letter-spacing:.24em;color:#f0dca8}
.pcout{margin-left:auto;font-size:12px;color:#f0dca8;font-family:"Songti SC",serif}
.sheet{background:linear-gradient(160deg,#1c1726,#110e18);border:1px solid #332c44;border-radius:12px;
padding:14px;margin-bottom:12px}
.srow{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;
border-bottom:1px solid #241e30;color:#b8b2c4}
.srow:last-child{border-bottom:0}
.srow b{font-family:"Songti SC",serif;font-size:15px;color:#f0e2c0}
.srow .dim{font-size:10.5px;color:#7d7789;margin-top:3px;line-height:1.5}
.buybtn{padding:7px 14px;border-radius:8px;font-size:11.5px;letter-spacing:.1em;
background:linear-gradient(#3a3248,#221c30);border:1px solid #4a3f5c;color:#e0d8c8}
.buybtn:active{background:linear-gradient(#4a4058,#2a2338)}
.buybtn.on{background:linear-gradient(#e8cd90,#a8863a);color:#1a1305;border-color:#f6e6bb;font-weight:700}
/* 图鉴 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:9px;text-align:center;font-size:12.5px;letter-spacing:.14em;
background:#181420;border:1px solid #332c44;color:#8a8497}
.tab.on{background:linear-gradient(#3a3248,#221c30);border-color:#6a5638;color:#f0dca8}
.dexgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dexcell{aspect-ratio:1;border-radius:10px;border:1px solid #332c44;
background:linear-gradient(160deg,#1a1622,#0e0b14);display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:5px;padding:8px;position:relative}
.dexcell.lock{opacity:.35}
.dexcell .dn{font-size:9.5px;color:#c8b090;text-align:center;letter-spacing:.06em}
.dexcell .dots{display:flex;gap:4px}
.dexcell .dots i{width:5px;height:5px;border-radius:50%;background:#ffdc96;
box-shadow:0 0 6px rgba(255,220,150,.9)}
/* 抽奖 */
.gacha{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.gbox{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;
background:radial-gradient(circle at 38% 32%,#4a3c58,#1a1424 62%,#0a0710);
border:2px solid rgba(232,200,138,.45);
box-shadow:0 0 50px rgba(232,200,138,.3),inset 0 0 40px rgba(0,0,0,.9);
animation:gb 4s ease-in-out infinite}
@keyframes gb{50%{transform:scale(1.05);box-shadow:0 0 70px rgba(232,200,138,.5),inset 0 0 40px rgba(0,0,0,.9)}}
.gbox svg{width:70px;height:70px;filter:drop-shadow(0 0 16px rgba(255,220,150,.8))}
/* 签到 */
.signrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.daybox{width:calc(25% - 6px);aspect-ratio:.85;border-radius:9px;border:1px solid #332c44;
background:linear-gradient(160deg,#1a1622,#0e0b14);display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:4px;font-size:10px;color:#8a8497}
.daybox.got{background:linear-gradient(160deg,#2a3a2a,#162014);border-color:#3a6a44;color:#8fd8a0}
.daybox.today{border-color:#e8cd90;box-shadow:0 0 18px rgba(232,200,138,.4)}
.daybox b{font-family:"Songti SC",serif;font-size:12px;color:#f0dca8}
/* 战斗（沿用） */
.top{flex:0 0 auto;padding:12px 16px 9px;position:relative}
.top::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:1px;
background:linear-gradient(90deg,transparent,rgba(232,200,138,.45),rgba(232,200,138,.05))}
.row1{display:flex;align-items:center;gap:10px}
.ibtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:#c8c0b0;
background:#1a1622;border:1px solid #3a3248;flex:0 0 auto}
.ibtn:active{background:#2a2434}
.hpb{flex:1}
.hline{display:flex;align-items:baseline;gap:4px}
.hpnum{font-family:"Songti SC",serif;font-size:22px;font-weight:700;color:#ffd8d0;line-height:1;
text-shadow:0 0 16px rgba(255,90,60,.75)}
.hpmax{font-size:10px;color:#a08a90}
.hpbar{height:7px;border-radius:4px;background:#1a1018;margin-top:4px;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(180deg,#ff7058,#a02014);
box-shadow:0 0 12px rgba(255,90,60,.9);transition:width .35s}
.sanb{width:92px;flex:0 0 auto}
.slbl{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.2em;color:#7a92b0}
.slbl b{color:#9ac8f8;font-family:"Songti SC",serif;font-size:10px}
.sanbar{height:6px;border-radius:3px;background:#0e1622;margin-top:4px;overflow:hidden}
.sanbar i{display:block;height:100%;background:linear-gradient(180deg,#9ad4ff,#2a5a92);
box-shadow:0 0 10px rgba(120,180,240,.85);transition:width .4s}
.orbrow{display:flex;gap:5px;align-items:center;margin-top:7px}
.pip{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#fffef5,#f0d288 42%,#b08a34 76%,#6a4f16);
box-shadow:0 0 12px rgba(240,210,140,1),inset 0 1px 1px #fff;transition:.3s}
.pip.off{background:#161622;box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
.di{margin-left:auto;font-size:9px;color:#8a8497;text-align:right;line-height:1.5}
.arena{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.chainbar{position:absolute;top:0;left:50%;transform:translateX(-50%);font-family:"Songti SC",serif;
font-size:13px;letter-spacing:.12em;color:#ffd98a;opacity:.3;transition:.2s}
.chainbar.on{opacity:1;transform:translateX(-50%) scale(1.1)}
.hero{position:absolute;left:1%;bottom:6%;width:64px;height:124px;
filter:drop-shadow(0 0 22px rgba(232,200,138,.5));transition:transform .15s;z-index:2}
.hero.hit{transform:translateX(-11px) rotate(-5deg);filter:drop-shadow(0 0 22px rgba(255,60,40,.85))}
.hero.atk{transform:translateX(22px)}
.hero .fl{animation:flick .28s infinite alternate;transform-origin:26px 110px}
@keyframes flick{to{transform:scale(1.14,.88)}}
.hero .cl{animation:sway 5s infinite;transform-origin:50px 118px}
@keyframes sway{50%{transform:rotate(.9deg)}}
.hero .e2{animation:hp2 3.2s infinite}
@keyframes hp2{50%{opacity:.5}}
.foes{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}
.foe{position:relative;flex:0 0 auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:.18s}
.fbody{position:relative;animation:drift 8s infinite}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.mist{position:absolute;inset:0;border-radius:50%;
background:radial-gradient(circle at 50% 46%,rgba(30,20,42,.99) 0%,rgba(12,7,18,.95) 42%,rgba(6,3,9,.75) 62%,transparent 76%);
filter:blur(14px);animation:mb 5.2s ease-in-out infinite}
@keyframes mb{0%,100%{transform:scale(1)}50%{transform:scale(1.06,1.03)}}
.mist2{position:absolute;inset:14% 8% 12% 10%;border-radius:50%;
background:radial-gradient(circle at 46% 40%,rgba(38,26,52,.95),rgba(10,6,16,.85) 55%,transparent 80%);
filter:blur(11px);animation:mb2 4.4s ease-in-out infinite}
@keyframes mb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5px,4px) scale(1.08,.96)}}
.ew{position:absolute;pointer-events:none}
.eye{width:100%;height:100%;border-radius:50%;background:#fff;
box-shadow:0 0 10px 4px rgba(255,240,200,.9),0 0 26px 10px rgba(255,215,150,.5),0 0 60px 24px rgba(255,190,110,.18);
animation:bl 5.6s ease-in-out infinite}
@keyframes bl{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.04)}}
.ew.d1 .eye{animation-delay:.9s}.ew.d2 .eye{animation-delay:2.2s}.ew.d3 .eye{animation-delay:3.4s}
.foe.sel .mist{box-shadow:0 0 40px rgba(255,210,150,.35)}
.foe.sel .mname{color:#ffe4a8}
.foe.dead{opacity:0;transform:translateY(-36px) scale(.55);pointer-events:none;transition:.7s}
.foe.dead .eye{opacity:0;transition:.5s;box-shadow:none}
.mhp{width:80%;height:6px;background:#160f1c;border-radius:3px;margin-top:9px;overflow:hidden}
.mhp i{display:block;height:100%;background:linear-gradient(180deg,#ff6a52,#9c1c12);
box-shadow:0 0 10px rgba(255,90,60,.85);transition:width .3s}
.fhp{display:flex;align-items:baseline;gap:3px;margin-top:5px;font-family:"Songti SC",serif}
.fhp .cur{font-size:16px;font-weight:700;color:#ff9a86}
.fhp .sep{font-size:9px;color:#6a5560}
.fhp .max{font-size:10px;color:#8a6f78}
.mname{text-align:center;font-family:"Songti SC",serif;font-size:10px;letter-spacing:.14em;color:#c8b090;margin-top:3px}
.pv{display:inline-block;font-size:7.5px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;margin-top:3px}
.wk{text-align:center;font-size:7.5px;color:#7a92b0;margin-top:2px}
.ult{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8.5px;padding:2px 7px;
border-radius:5px;background:#2a0d0d;border:1px solid #7a2418;color:#ff8a70;white-space:nowrap;
animation:ulp .9s infinite;z-index:5}
@keyframes ulp{50%{box-shadow:0 0 16px rgba(255,70,40,.8)}}
.story{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);
font-family:"Songti SC",serif;font-size:10.5px;color:#7d7690;line-height:1.7;text-align:center;max-width:320px}
.bottom{flex:0 0 auto;padding:0 12px 14px}
.handrow{display:flex;align-items:flex-end;gap:9px}
.hand{flex:1;display:flex;align-items:flex-end;gap:8px;overflow-x:auto;overflow-y:visible;
padding:12px 2px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hand::-webkit-scrollbar{display:none}
.card{position:relative;width:90px;height:130px;flex:0 0 auto;transform-origin:50% 100%;
transition:transform .16s,opacity .14s;animation:cin .3s backwards;cursor:pointer}
@keyframes cin{from{opacity:0;transform:translateY(20px)}}
.card:active{transform:translateY(-18px) scale(1.08)}
.card.no{opacity:.5}
.fr{position:absolute;inset:0;border-radius:13px;padding:3px;
background:linear-gradient(158deg,#fffbe8,#efd9a2 10%,#b8934e 24%,#fdf0c8 38%,#96762e 52%,#e8cd90 68%,#fff6dc 82%,#6a4f18);
box-shadow:0 0 0 .5px #0a0602,0 12px 26px rgba(0,0,0,.92)}
.q1 .fr{background:linear-gradient(158deg,#d8d4c8,#a8a496 22%,#6e6a60 46%,#b8b4a8 64%,#8a867c 82%,#54504a)}
.q2 .fr{background:linear-gradient(158deg,#d8ecff,#7fb4e8 16%,#2e6aa8 40%,#a8d4ff 58%,#3a7ec0 78%,#1c4670)}
.q3 .fr{background:linear-gradient(158deg,#f0d8ff,#b47ae8 16%,#6a34a8 40%,#dcb4ff 58%,#8a52c0 78%,#421c70)}
.q4 .fr{background:linear-gradient(158deg,#fff6d8,#f0d082 12%,#c89a2a 34%,#fff0c0 50%,#e0b03a 68%,#ffe9a8 84%,#8a6510);
box-shadow:0 0 0 .5px #0a0602,0 10px 26px rgba(0,0,0,.9),0 0 34px rgba(255,210,110,.75)}
.in{position:absolute;inset:3px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(130% 50% at 50% -10%,rgba(255,235,190,.24),transparent 55%),
linear-gradient(172deg,#3e3024,#271e17 42%,#16110c);
box-shadow:inset 0 1px 0 rgba(255,245,215,.42),inset 0 0 0 1px rgba(0,0,0,.8)}
.art{height:56px;margin:7px 7px 2px;border-radius:6px;display:grid;place-items:center;
background:radial-gradient(circle at 50% 68%,rgba(240,215,165,.28),transparent 74%),#0d0a08;
box-shadow:inset 0 0 0 1px rgba(240,210,150,.3)}
.art.a{box-shadow:inset 0 0 0 1px rgba(235,105,58,.48),inset 0 0 24px rgba(205,72,26,.65)}
.art.s{box-shadow:inset 0 0 0 1px rgba(95,165,230,.45),inset 0 0 24px rgba(58,128,190,.65)}
.art.p{box-shadow:inset 0 0 0 1px rgba(175,120,245,.45),inset 0 0 24px rgba(135,72,205,.65)}
.art.f{box-shadow:inset 0 0 0 1px rgba(240,150,62,.48),inset 0 0 24px rgba(220,108,26,.65)}
.art.x{box-shadow:inset 0 0 0 1px rgba(185,85,205,.52),inset 0 0 24px rgba(145,52,170,.65)}
.art svg{width:30px;height:30px;filter:drop-shadow(0 0 10px rgba(250,230,180,.9))}
.gm{position:absolute;top:-9px;left:-9px;width:29px;height:29px;border-radius:50%;z-index:3;
display:grid;place-items:center;font-size:14px;font-weight:800;color:#ffe9b0;
background:radial-gradient(circle at 35% 28%,#3a2e20,#1a1208 60%,#0a0703);
border:1.5px solid rgba(240,210,150,.9);box-shadow:0 0 12px rgba(240,210,150,.7)}
.nm{font-family:"Songti SC",serif;font-size:12px;text-align:center;color:#fff6dc}
.ds{font-size:8.5px;text-align:center;color:#c8bda6;margin-top:2px}
.end{flex:0 0 58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;
line-height:1.2;color:#1a1305;font-weight:800;text-align:center;border:0;
background:radial-gradient(circle at 34% 24%,#fffef6,#f8e8bc 28%,#e6c87e 52%,#b0892e 78%,#75581a);
box-shadow:0 0 0 1px #2a1c06,0 0 30px rgba(240,210,150,.5),inset 0 2px 2px rgba(255,255,255,.95)}
.end:active{transform:scale(.92)}
.end.lock{opacity:.35}
/* 地图 / 结算 / 选牌 */
.map,.reward,.summary{flex:1;display:flex;flex-direction:column;padding:14px 18px;overflow-y:auto}
.reward,.summary{justify-content:center}
.mtop{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em;color:#8a8497}
.panel{margin-top:14px;border:1px solid #332c44;border-radius:12px;padding:14px;
background:linear-gradient(160deg,#1c1726,#110e18)}
.prow{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;color:#a8a2b6}
.prow b{font-family:"Songti SC",serif;font-size:15px;color:#f0e2c0}
.rt{font-family:"Songti SC",serif;font-size:21px;letter-spacing:.2em;color:#f0dca8;text-align:center}
.rs{text-align:center;font-size:11px;color:#8a8497;margin-top:9px;line-height:1.7}
.relic{margin-top:14px;padding:12px;border-radius:11px;border:1px solid #5a4a30;background:rgba(240,210,150,.1)}
.rl1{font-size:9px;letter-spacing:.24em;color:#a89870}
.rl2{font-family:"Songti SC",serif;font-size:15px;color:#ffeec2;margin-top:5px}
.rl3{font-size:10.5px;color:#a8a2b6;margin-top:3px}
.pickrow{display:flex;gap:8px;justify-content:center;margin-top:18px}
.qlabel{text-align:center;font-size:8.5px;letter-spacing:.2em;margin-top:5px}
.skip{margin-top:20px;padding:12px;border-radius:9px;text-align:center;font-size:12.5px;letter-spacing:.2em;
border:1px solid #3a3248;background:#181420;color:#a8a2b6}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(2,2,5,.94);z-index:150;display:flex;align-items:center;
justify-content:center;padding:22px;overflow-y:auto}
.dlg{max-width:340px;width:100%;background:linear-gradient(165deg,#1e1928,#0f0c16);
border:1px solid #4a3f5c;border-radius:16px;padding:22px;box-shadow:0 0 60px rgba(0,0,0,.95)}
.dlg h2{font-family:"Songti SC",serif;font-size:18px;color:#f0dca8;letter-spacing:.18em;font-weight:400;text-align:center}
.dlg p{font-size:12px;color:#a8a2b6;line-height:1.9;margin-top:14px;text-align:center}
.dbtn{margin-top:18px;padding:13px;border-radius:9px;text-align:center;font-size:13px;letter-spacing:.2em;
background:linear-gradient(#e8cd90,#a8863a);color:#1a1305;font-weight:700;border:0;width:100%}
.dbtn2{margin-top:10px;background:none;border:0;color:#6a6478;font-size:12px;width:100%;padding:10px;text-align:center}
/* 特效 */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.num{position:fixed;font-family:"Songti SC",serif;font-weight:800;pointer-events:none;z-index:70;
transform:translate(-50%,-50%);text-shadow:0 0 16px currentColor,0 3px 0 rgba(0,0,0,.95);

  B.energy--;B.hand.splice(i,1);B.disc.push('whisper');toast('撕毁了低语');render();return}
 var c=CARDS[key];if(B.energy<c.c){toast('能量不足');return}

   if(c.t==='f'&&hasRelic('ember'))base+=3;
   var d=Math.max(1,Math.round(base*cm*wk));
   var hits=c.hits||1;
   for(var h=0;h<hits;h++){(function(k){setTimeout(function(){
     if(B.foes[ti]){var one=Math.round(d/hits);hitFoe(ti,one,wk>1?3:(B.chain>=4?3:B.chain>=2?2:1));
      if(k===0){var p=foeRect(ti);slashAt(p.x,p.y)}}SFX.hit();},k*95)})(h)}
   animMs=hits*95;
   if(wk>1)toast('击中破绽！×2');
   setTimeout(function(){SFX.crit()},15);
  }
  if(c.dmgAll){for(var q=0;q<B.foes.length;q++){if(!B.foes[q].dead){hitFoe(q,Math.round((c.dmgAll+B.str)*cm),2);animMs+=80}}}
  if(c.blk){B.pBlock+=c.blk+(hasRelic('iron')?2:0)+(G.weapon==='shield'?3:0);SFX.block()}
  if(c.pow)B.str+=c.pow;
  if(c.heal)G.hp=Math.min(G.max,G.hp+c.heal);
  if(c.self)G.hp-=c.self;
  if(c.burn&&tf)tf.burn=(tf.burn||0)+c.burn;
  if(c.burnAll)B.foes.forEach(function(f){if(!f.dead)f.burn=(f.burn||0)+c.burnAll});
  if(c.draw)drawN(c.draw);
  if(c.weak&&tf)tf.weakDeb=(tf.weakDeb||0)+c.weak;
  B.disc.push(key);
  G.dexC[key]=1;
  if(B.chain>=3)flash('g');
  if(c.q>=4)setTimeout(function(){flash('g')},80);
  setTimeout(function(){
   B.lock=false;
   if(aliveFoes().length===0){B.over=true;setTimeout(winFloor,200);return}
   if(G.hp<=0){B.over=true;setTimeout(lose,200);return}
   render();
  },animMs+300);
 });
}
function endTurn(){
 if(!B||B.over||B.lock)return;
 var ws=0;for(var i=0;i<B.hand.length;i++)if(B.hand[i]==='whisper')ws++;
 if(ws){G.san-=5*ws;toast('低语缠绕 · 理智 -'+(5*ws));SFX.whisper()}
 B.hand=[];
 var pen=0;
 for(var j=0;j<B.foes.length;j++){
  var f=B.foes[j];if(f.dead)continue;
  if(f.pv==='armor')f.blk=(f.blk||0)+7;
  if(f.pv==='regen')f.hp=Math.min(f.max,f.hp+5);
  if(f.pv==='drain')pen=1;
  f.tick=(f.tick||0)+1;
  var isUlt=false;
  if(f.charging){isUlt=true;f.charging=false;f.tick=0}
  else if(f.tick>=4){f.charging=true;SFX.charge();toast(f.n+' 正在蓄力 —— 下回合重击！');continue}
  var times=(f.pv==='swift')?2:1;
  for(var t=0;t<times;t++){
   var raw=f.atk+((f.weakDeb||0)>0?-3:0);
   if(isUlt)raw=Math.round(raw*1.8);
   if(times===2)raw=Math.round(raw*0.6);
   var ab=Math.min(B.pBlock,raw);B.pBlock-=ab;raw-=ab;
   if(raw>0){
    G.hp-=raw;
    var sl=Math.round((3+B.n*0.2)*(hasRelic('mask')?0.7:1));
    if(f.pv==='greed')sl+=4;
    G.san-=sl;
    var snd=SFX[f.snd];if(snd)snd();else SFX.hurt();
    flash('r');shake();
    var hero=document.querySelector('.hero');if(hero){hero.classList.add('hit');setTimeout(function(){hero.classList.remove('hit')},200)}
   }
  }
  if(isUlt){SFX.ult();flash('r');shake();toast(f.n+' 的重击！')}
  f.blk=0;
  if(f.pv==='wail'&&f.tick%3===0){if(B.hand.length<8){B.hand.push('whisper');SFX.whisper()}}
  if(f.burn>0){f.hp-=f.burn;f.burn--;if(f.hp<=0)f.dead=true}
  if(f.weakDeb>0)f.weakDeb--;
 }
 B.pBlock=0;
 if(G.san<=0){G.san=0;G.hp-=6}
 if(G.hp<=0){B.over=true;setTimeout(lose,300);return}
 if(aliveFoes().length===0){B.over=true;setTimeout(winFloor,300);return}

 drawN((hasRelic('candle')?4:5)+extra);
 maybeWhisper();
 toast('新回合 · 抽 '+((hasRelic('candle')?4:5)+extra)+' 张');
 render();
}
function rollRewards(){

 var out=[];var w=[{q:1,w:52},{q:2,w:30},{q:3,w:15},{q:4,w:3}],guard=0;
 while(out.length<3&&guard++<60){
  var tot=0;w.forEach(function(x){tot+=x.w});
  var r=Math.random()*tot,pw=w[0];
  for(var i=0;i<w.length;i++){r-=w[i].w;if(r<=0){pw=w[i];break}}

 }

function foeHTML(f,w,idx){

 return '<div class="foe'+(B.target===idx?' sel':'')+(f.dead?' dead':'')+'" data-f="'+idx+'">'+ult

/* ===== 交互 ===== */
document.addEventListener('click',function(e){
 ac();
 var t=e.target.closest('[data-a]');
 var w=e.target.closest('[data-w]');
 if(w&&VIEW==='level'){
  var wid=w.getAttribute('data-w');var wd=null;
  for(var i=0;i<WEAPONS.length;i++)if(WEAPONS[i].id===wid)wd=WEAPONS[i];
  if(!wd)return;
  G.weapon=wid;G.deck=wd.deck.slice();G.pickedWeapon=true;
  G.max=44+weaponHpMod();G.hp=G.max;G.deck.forEach(function(k){G.dexC[k]=1});
  NW=null;save();go('level');return;
 }
 if(t){
  var a=t.getAttribute('data-a');var v=parseInt(t.getAttribute('data-v'),10);
  switch(a){
   case 'toHome':NW=null;go('home');return;
   case 'toLevel':go('level');return;
   case 'toMap':NW=null;go('map');return;
   case 'toReward':PICKS=rollRewards();rollRelic();go('reward');return;
   case 'go':startFloor(G.best+1);return;
   case 'night':startNight();return;
   case 'shop':go('shop');return;
   case 'gacha':go('gacha');return;
   case 'dex':go('dex');return;
   case 'settings':go('settings');return;
   case 'sign':go('sign');return;
   case 'dexC':DEXTAB='c';render();return;
   case 'dexF':DEXTAB='f';render();return;
   case 'help':showHelp();return;
   case 'closeDlg':var m=t.closest('.mask');if(m)m.remove();return;
   case 'end':endTurn();return;
   case 'pick':pickCard(v);return;
   case 'skip':if(RELIC)G.relics.push(RELIC);PICKS=null;RELIC=null;save();go('map');return;
   case 'contact':location.href='mailto:2797800498@qq.com?subject=%E5%AE%88%E5%A4%9C%E4%BA%BA%E5%8F%8D%E9%A6%88';return;
   case 'tutNext':tutClear();TUT.i++;tutShow();return;
   case 'tutSkip':tutClear();G.tutDone=true;save();return;
   case 'avBuy':
    for(var i2=0;i2<AVATARS.length;i2++){if(AVATARS[i2].id===v){
     if(G.gold<AVATARS[i2].p){toast('金币不足');return}
     G.gold-=AVATARS[i2].p;G.ownedAv.push(v);G.avatar=v;SFX.coin();save();render();return;
    }}
    return;
   case 'avUse':G.avatar=v;save();render();return;
   case 'buyTicket':
    if(G.gold<200){toast('金币不足');return}
    G.gold-=200;G.tickets++;SFX.coin();save();render();return;
   case 'pull':doPull();return;
   case 'toggle':
    var key=t.getAttribute('data-v');
    if(key==='sfx'){G.sfx=!G.sfx;if(!G.sfx&&MG)MG.gain.value=0;else if(MG)MG.gain.value=.4}
    if(key==='music'){G.music=!G.music}
    save();render();return;
   case 'nick':{
    var nn=prompt('输入新昵称（最多 6 字）',G.nick);
    if(nn&&nn.trim()){G.nick=nn.trim().slice(0,6);save();render()}
    return;
   }
   case 'doSign':{
    if(G.lastSign===today()){toast('今天已经签过了');return}
    var rw=[20,25,30,35,40,50,100][G.signDays%7]||20;
    G.gold+=rw;G.lastSign=today();G.signDays++;

   case 'resetYes':G=DEF();save();var m2=t.closest('.mask');if(m2)m2.remove();go('home');return;

 }
