<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050408">
<title>守夜人</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;background:#08060e;color:#f2ecdd;font-family:-apple-system,"PingFang SC",sans-serif;
background:radial-gradient(58% 40% at 50% 26%,#1a1224,#08060e 58%,#020104 88%)}
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;overflow:hidden}
.fadeov{position:fixed;inset:0;background:#020104;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.fadeov.on{opacity:1}
/* 通用 */
.hd{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;flex:0 0 auto}
.bk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:15px;
background:#1a1622;border:1px solid #3a3248;color:#c8c0b0}
.bk:active{background:#2a2434}
.tt{font-family:"Songti SC",serif;font-size:19px;letter-spacing:.24em;color:#f0dca8}
.ct{margin-left:auto;font-size:12px;color:#f0dca8;font-family:"Songti SC",serif}
.pg{flex:1;display:flex;flex-direction:column;padding:0 16px 16px;overflow-y:auto}
.sheet{background:linear-gradient(160deg,#1c1726,#110e18);border:1px solid #332c44;border-radius:12px;padding:14px;margin-bottom:12px}
.sr{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:9px 0;border-bottom:1px solid #241e30;color:#b8b2c4}
.sr:last-child{border-bottom:0}
.sr b{font-family:"Songti SC",serif;font-size:15px;color:#f0e2c0}
.dm{font-size:10.5px;color:#7d7789;margin-top:3px;line-height:1.5}
.btn{display:block;width:100%;padding:15px;border-radius:11px;text-align:center;border:1px solid #4a3f5c;
font-family:"Songti SC",serif;font-size:15px;letter-spacing:.2em;color:#f6e8c4;
background:linear-gradient(160deg,#2a2338,#161220);box-shadow:0 5px 14px rgba(0,0,0,.7)}
.btn:active{transform:scale(.98);filter:brightness(1.2)}
.btn.gold{background:radial-gradient(circle at 34% 26%,#fffef6,#f8e8bc 28%,#e2c47e 54%,#a8823a 78%,#6a4f16);
color:#1a1305;font-weight:700;border-color:#f6e6bb;box-shadow:0 0 26px rgba(232,200,138,.4),0 5px 14px rgba(0,0,0,.8)}
.btn.dis{opacity:.4}
.sm{padding:8px 14px;border-radius:8px;font-size:11.5px;letter-spacing:.1em;
background:linear-gradient(#3a3248,#221c30);border:1px solid #4a3f5c;color:#e0d8c8}
.sm.on{background:linear-gradient(#e8cd90,#a8863a);color:#1a1305;border-color:#f6e6bb;font-weight:700}
/* 主页 */
.home{flex:1;display:flex;flex-direction:column;padding:16px 18px;position:relative;overflow:hidden}
#ef{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ep{position:absolute;display:flex;gap:6px;opacity:0;animation:ep 5s forwards;
filter:drop-shadow(0 0 10px rgba(255,235,190,.9))}
.ep i{display:block;background:#fff;border-radius:50%;
box-shadow:0 0 8px 3px rgba(255,244,214,.95),0 0 20px 8px rgba(255,205,130,.4)}
@keyframes ep{0%{opacity:0;transform:scale(.8)}14%{opacity:.92}42%{opacity:.8}
50%{opacity:.08;transform:scaleY(.08)}57%{opacity:.88;transform:scale(1)}100%{opacity:0}}
.hd2{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;
border:2px solid rgba(232,200,138,.55);background:radial-gradient(circle at 35% 30%,#2c2438,#12101a)}
.nk{font-family:"Songti SC",serif;font-size:16px;color:#f2e6c8;letter-spacing:.08em}
.hs{font-size:10px;color:#8a8497;margin-top:3px}
.hm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2}
.ht{font-family:"Songti SC",serif;font-size:44px;letter-spacing:.24em;text-indent:.24em;
background:linear-gradient(180deg,#fffdf5,#f6e6bc 28%,#b8924a 58%,#fff6d8 88%);
-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(232,200,138,.5))}
.he{font-size:9px;letter-spacing:.46em;text-indent:.46em;color:#a09889;margin-top:12px}
.hmenu{width:100%;position:relative;z-index:2;padding-bottom:10px}
.hmenu .btn{margin-bottom:9px}
.mrow{display:flex;gap:9px;margin-bottom:9px}
.mrow .btn{margin-bottom:0;flex:1;font-size:13.5px;letter-spacing:.14em;padding:13px}
.bd{position:relative}
.bd::after{content:"";position:absolute;top:7px;right:10px;width:8px;height:8px;border-radius:50%;
background:#e04a34;box-shadow:0 0 8px #e04a34}
/* 卡牌 */
.card{position:relative;width:90px;height:130px;flex:0 0 auto;transform-origin:50% 100%;
transition:transform .15s,opacity .14s;animation:cin .3s backwards;cursor:pointer}
@keyframes cin{from{opacity:0;transform:translateY(20px)}}
.card:active{transform:translateY(-16px) scale(1.07)}
.card.no{opacity:.45}
.fr{position:absolute;inset:0;border-radius:13px;padding:3px;
background:linear-gradient(158deg,#fffbe8,#efd9a2 10%,#b8934e 24%,#fdf0c8 38%,#96762e 52%,#e8cd90 68%,#fff6dc 82%,#6a4f18)}
.q1 .fr{background:linear-gradient(158deg,#d8d4c8,#a8a496 22%,#6e6a60 46%,#b8b4a8 64%,#8a867c 82%,#54504a)}
.q2 .fr{background:linear-gradient(158deg,#d8ecff,#7fb4e8 16%,#2e6aa8 40%,#a8d4ff 58%,#3a7ec0 78%,#1c4670)}
.q3 .fr{background:linear-gradient(158deg,#f0d8ff,#b47ae8 16%,#6a34a8 40%,#dcb4ff 58%,#8a52c0 78%,#421c70)}
.q4 .fr{background:linear-gradient(158deg,#fff6d8,#f0d082 12%,#c89a2a 34%,#fff0c0 50%,#e0b03a 68%,#ffe9a8 84%,#8a6510);
box-shadow:0 0 24px rgba(255,210,110,.6)}
.in{position:absolute;inset:3px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;
background:linear-gradient(172deg,#3e3024,#271e17 42%,#16110c)}
.q2 .in{background:linear-gradient(172deg,#25303e,#1a222e 42%,#0c1218)}
.q3 .in{background:linear-gradient(172deg,#3a2a48,#261a34 42%,#150c1e)}
.art{height:56px;margin:7px 7px 2px;border-radius:6px;display:grid;place-items:center;
background:radial-gradient(circle at 50% 68%,rgba(240,215,165,.26),transparent 74%),#0d0a08;
box-shadow:inset 0 0 0 1px rgba(240,210,150,.3)}
.art svg{width:30px;height:30px;filter:drop-shadow(0 0 9px rgba(250,230,180,.9))}
.gm{position:absolute;top:-8px;left:-8px;width:28px;height:28px;border-radius:50%;z-index:3;
display:grid;place-items:center;font-size:14px;font-weight:800;color:#ffe9b0;
background:radial-gradient(circle at 35% 28%,#3a2e20,#1a1208 60%,#0a0703);
border:1.5px solid rgba(240,210,150,.9);box-shadow:0 0 12px rgba(240,210,150,.7)}
.nm{font-family:"Songti SC",serif;font-size:12px;text-align:center;color:#fff6dc}
.ds{font-size:8.5px;text-align:center;color:#c8bda6;margin-top:2px}
/* 战斗 */
.top{padding:12px 16px 8px;flex:0 0 auto;border-bottom:1px solid rgba(232,200,138,.15)}
.r1{display:flex;align-items:center;gap:10px}
.hp{flex:1}
.hn{font-family:"Songti SC",serif;font-size:21px;font-weight:700;color:#ffd8d0;text-shadow:0 0 14px rgba(255,90,60,.7)}
.hx{font-size:10px;color:#a08a90}
.hb{height:7px;border-radius:4px;background:#1a1018;margin-top:4px;overflow:hidden}
.hb i{display:block;height:100%;background:linear-gradient(180deg,#ff7058,#a02014);
box-shadow:0 0 10px rgba(255,90,60,.9);transition:width .35s}
.sb{width:88px}
.sl{display:flex;justify-content:space-between;font-size:8px;letter-spacing:.18em;color:#7a92b0}
.sl b{color:#9ac8f8;font-family:"Songti SC",serif;font-size:10px}
.sbk{height:6px;border-radius:3px;background:#0e1622;margin-top:4px;overflow:hidden}
.sbk i{display:block;height:100%;background:linear-gradient(180deg,#9ad4ff,#2a5a92);transition:width .4s}
.or{display:flex;gap:5px;align-items:center;margin-top:7px}
.pip{width:12px;height:12px;border-radius:50%;
background:radial-gradient(circle at 34% 28%,#fffef5,#f0d288 42%,#b08a34 76%,#6a4f16);
box-shadow:0 0 10px rgba(240,210,140,1);transition:.3s}
.pip.off{background:#161622;box-shadow:none}
.di{margin-left:auto;font-size:9px;color:#8a8497;text-align:right;line-height:1.5}
.ar{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
.cb{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-family:"Songti SC",serif;
font-size:12.5px;color:#ffd98a;opacity:.3;transition:.2s}
.cb.on{opacity:1;transform:translateX(-50%) scale(1.1)}
.hr{position:absolute;left:1%;bottom:6%;width:62px;height:120px;
filter:drop-shadow(0 0 20px rgba(232,200,138,.5));transition:transform .15s}
.hr.hit{transform:translateX(-10px) rotate(-5deg)}
.hr.atk{transform:translateX(20px)}
.fs{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}
.foe{flex:0 0 auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;position:relative}
.fb{position:relative;animation:dr 7s infinite}
@keyframes dr{50%{transform:translateY(-6px)}}
.ms{position:absolute;inset:0;border-radius:50%;
background:radial-gradient(circle at 50% 46%,rgba(30,20,42,.99) 0%,rgba(12,7,18,.95) 42%,rgba(6,3,9,.7) 62%,transparent 76%);
filter:blur(14px)}
.ms2{position:absolute;inset:14%;border-radius:50%;
background:radial-gradient(circle at 46% 40%,rgba(38,26,52,.9),transparent 80%);filter:blur(10px)}
.ew{position:absolute;pointer-events:none}
.ey{width:100%;height:100%;border-radius:50%;background:#fff;
box-shadow:0 0 10px 4px rgba(255,240,200,.9),0 0 26px 10px rgba(255,215,150,.5);
animation:bl 5.6s infinite}
@keyframes bl{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.04)}}
.ew.d1 .ey{animation-delay:.9s}.ew.d2 .ey{animation-delay:2.2s}
.foe.sel .mname{color:#ffe4a8}
.foe.dead{opacity:0;transform:translateY(-30px) scale(.6);pointer-events:none;transition:.6s}
.mhp{width:80%;height:6px;background:#160f1c;border-radius:3px;margin-top:8px;overflow:hidden}
.mhp i{display:block;height:100%;background:linear-gradient(180deg,#ff6a52,#9c1c12);transition:width .3s}
.fhp{display:flex;align-items:baseline;gap:3px;margin-top:4px;font-family:"Songti SC",serif}
.fhp .cur{font-size:15px;font-weight:700;color:#ff9a86}
.fhp .sp{font-size:9px;color:#6a5560}
.fhp .mx{font-size:10px;color:#8a6f78}
.mname{font-family:"Songti SC",serif;font-size:10px;color:#c8b090;margin-top:3px;letter-spacing:.12em}
.pv{font-size:7.5px;padding:1px 5px;border-radius:4px;border:1px solid currentColor;margin-top:3px}
.wk{font-size:7.5px;color:#7a92b0;margin-top:2px}
.ult{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8.5px;padding:2px 7px;
border-radius:5px;background:#2a0d0d;border:1px solid #7a2418;color:#ff8a70;white-space:nowrap;
animation:up .9s infinite;z-index:5}
@keyframes up{50%{box-shadow:0 0 14px rgba(255,70,40,.8)}}
.sty{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);
font-family:"Songti SC",serif;font-size:10px;color:#7d7690;text-align:center;max-width:320px}
.bt{padding:0 12px 14px;flex:0 0 auto}
.hrow{display:flex;align-items:flex-end;gap:9px}
.hand{flex:1;display:flex;align-items:flex-end;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.hand::-webkit-scrollbar{display:none}
.end{flex:0 0 56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;
line-height:1.2;color:#1a1305;font-weight:800;text-align:center;border:0;
background:radial-gradient(circle at 34% 24%,#fffef6,#f8e8bc 28%,#e6c87e 52%,#b0892e 78%,#75581a);
box-shadow:0 0 0 1px #2a1c06,0 0 28px rgba(240,210,150,.5)}
.end.lock{opacity:.35}
/* 结算/选牌 */
.sum{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 18px}
.stt{font-family:"Songti SC",serif;font-size:26px;letter-spacing:.3em;color:#f0dca8;text-align:center}
.pickrow{display:flex;gap:8px;justify-content:center;margin-top:16px}
.ql{text-align:center;font-size:8.5px;letter-spacing:.2em;margin-top:5px}
/* 图鉴 */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:9px;text-align:center;font-size:12.5px;
background:#181420;border:1px solid #332c44;color:#8a8497}
.tab.on{background:linear-gradient(#3a3248,#221c30);border-color:#6a5638;color:#f0dca8}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.dc{aspect-ratio:1;border-radius:10px;border:1px solid #332c44;
background:linear-gradient(160deg,#1a1622,#0e0b14);display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:4px;padding:6px}
.dc.lock{opacity:.35}
.dc .dn{font-size:9px;color:#c8b090;text-align:center}
.dc .dd{font-size:7.5px;color:#7d7789}
/* 抽奖 */
.gc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.gbox{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;
background:radial-gradient(circle at 38% 32%,#4a3c58,#1a1424 62%,#0a0710);
border:2px solid rgba(232,200,138,.45);box-shadow:0 0 44px rgba(232,200,138,.28);
animation:gb 4s ease-in-out infinite}
@keyframes gb{50%{transform:scale(1.05)}}
/* 签到 */
.sr2{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.db{width:calc(25% - 6px);aspect-ratio:.85;border-radius:9px;border:1px solid #332c44;
background:linear-gradient(160deg,#1a1622,#0e0b14);display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:3px;font-size:9px;color:#8a8497}
.db.got{background:linear-gradient(160deg,#2a3a2a,#162014);border-color:#3a6a44;color:#8fd8a0}
.db.td{border-color:#e8cd90;box-shadow:0 0 16px rgba(232,200,138,.35)}
.db b{font-family:"Songti SC",serif;font-size:11px;color:#f0dca8}
/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(2,2,5,.94);z-index:150;display:flex;align-items:center;
justify-content:center;padding:22px;overflow-y:auto}
.dlg{max-width:330px;width:100%;background:linear-gradient(165deg,#1e1928,#0f0c16);
border:1px solid #4a3f5c;border-radius:16px;padding:20px}
.dlg h2{font-family:"Songti SC",serif;font-size:18px;color:#f0dca8;letter-spacing:.16em;font-weight:400;text-align:center}
.dlg p{font-size:12px;color:#a8a2b6;line-height:1.9;margin-top:12px;text-align:center}
.dbtn{margin-top:16px;padding:12px;border-radius:9px;text-align:center;font-size:13px;letter-spacing:.2em;
background:linear-gradient(#e8cd90,#a8863a);color:#1a1305;font-weight:700;border:0;width:100%}
.dbtn2{margin-top:8px;background:none;border:0;color:#6a6478;font-size:12px;width:100%;padding:10px;text-align:center}
/* 教程 */
.tuthi{position:relative!important;z-index:330!important;
box-shadow:0 0 0 9999px rgba(0,0,0,.85)!important;
outline:2px solid rgba(255,215,150,.85)!important;outline-offset:4px;border-radius:10px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.num{position:fixed;font-family:"Songti SC",serif;font-weight:800;pointer-events:none;z-index:70;
transform:translate(-50%,-50%);text-shadow:0 0 14px currentColor,0 3px 0 rgba(0,0,0,.95);
animation:fy .9s cubic-bezier(.2,.9,.3,1) forwards;white-space:nowrap}
@keyframes fy{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
20%{opacity:1;transform:translate(-50%,-100%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-230%) scale(.9)}}
.sl{position:fixed;width:170px;height:170px;margin:-85px 0 0 -85px;pointer-events:none;
animation:sa .3s forwards;z-index:65}
@keyframes sa{0%{opacity:0;transform:scale(.6) rotate(-24deg)}30%{opacity:1}100%{opacity:0;transform:scale(1.15) rotate(14deg)}}
#fl{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:55}
#fl.on{animation:fa .5s}
@keyframes fa{0%{opacity:0}12%{opacity:.9}100%{opacity:0}}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);background:rgba(6,5,10,.97);
border:1px solid #4a4030;border-radius:8px;padding:9px 15px;font-size:12px;color:#f0e0b8;
opacity:0;transition:.25s;pointer-events:none;z-index:90;text-align:center;max-width:82vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx"></div><div id="fl"></div><div id="toast"></div>
<script>
function $(id){return document.getElementById(id)}
function rnd(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var TT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(TT);TT=setTimeout(function(){t.classList.remove('on')},1900)}
function flash(c){var f=$('fl');f.style.background=c==='g'?'radial-gradient(circle at 50% 44%,rgba(255,246,214,.92),rgba(232,196,106,.35) 42%,transparent 72%)':'radial-gradient(circle at 50% 45%,rgba(255,120,90,.88),rgba(160,20,15,.55) 45%,transparent 74%)';f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function shake(){document.body.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(6px)'},{transform:'translateX(-3px)'},{transform:'translateX(0)'}],{duration:210})}
var AC=null,MG=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.4;MG.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function V(o){var c=ac();if(!c)return;var t=c.currentTime+(o.d||0);var g=c.createGain();g.connect(MG);var S=[];
if(o.n){var n=Math.floor(c.sampleRate*o.dur),b=c.createBuffer(1,n,c.sampleRate),x=b.getChannelData(0);
for(var i=0;i<n;i++)x[i]=Math.random()*2-1;var s=c.createBufferSource();s.buffer=b;
var f=c.createBiquadFilter();f.type=o.filt||'lowpass';f.frequency.value=o.cut||1200;s.connect(f);f.connect(g);S.push(s)}
if(o.f0){var os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f0,t);
if(o.f1)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t+o.dur);os.connect(g);S.push(os)}
g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(o.vol||.16,t+(o.atk||.01));
g.gain.exponentialRampToValueAtTime(.0001,t+o.dur);
S.forEach(function(s){s.start(t);s.stop(t+o.dur+.06)})}
var SFX={
play:function(){V({f0:1400,f1:900,dur:.045,vol:.07})},
hit:function(){V({f0:130,f1:50,dur:.18,vol:.2})},
hurt:function(){V({f0:66,f1:26,dur:.42,type:'sawtooth',vol:.16,atk:.012})},
block:function(){V({f0:2200,f1:1600,dur:.1,type:'triangle',vol:.06})},
whisper:function(){V({f0:46,dur:1.6,vol:.12,atk:.7})},
win:function(){V({f0:523,dur:.3,vol:.1});V({f0:659,dur:.4,vol:.09,d:.1});V({f0:784,dur:.8,vol:.1,d:.2})},
die:function(){V({f0:300,f1:38,dur:2,vol:.17,atk:.02})},
boss:function(){V({f0:44,dur:.5,vol:.24,atk:.01})},
coin:function(){V({f0:1200,dur:.1,type:'triangle',vol:.09});V({f0:1600,dur:.12,vol:.06,d:.05})},
charge:function(){V({f0:60,f1:180,dur:1,type:'sawtooth',vol:.12,atk:.4})},
ult:function(){V({f0:70,f1:28,dur:.6,type:'sawtooth',vol:.28,atk:.01})},
a1:function(){V({f0:120,f1:42,dur:.3,vol:.18,atk:.01})},
a2:function(){V({f0:200,f1:60,dur:.26,vol:.15})},

+'<button class="btn gold" data-a="pull">'+(G.tickets>0?'抽一次（消耗 1 券）':'抽一次（◈ 120）')+'</button>'
+'</div></div></div>';
}
function doPull(){
if(G.tickets>0)G.tickets--;
else if(G.gold>=120)G.gold-=120;
else{toast('券和金币都不够');return}
G.pity++;
var got=null;
if(G.pity>=10){
var avail=AVATARS.filter(function(a){return G.ownedAv.indexOf(a.id)<0});
if(avail.length)got=avail[rnd(0,avail.length-1)];
G.pity=0;
}
var r=Math.random();
var msg='';
if(got){G.ownedAv.push(got.id);G.avatar=got.id;msg='获得头像 '+(got.id+1)}
else if(r<0.5){var g=rnd(40,90);G.gold+=g;msg='获得 ◈ '+g}
else if(r<0.8){G.tickets++;msg='获得抽奖券 ×1'}
else if(r<0.95){var g2=rnd(120,200);G.gold+=g2;msg='获得 ◈ '+g2}
else{var av2=AVATARS.filter(function(a){return G.ownedAv.indexOf(a.id)<0});
if(av2.length){var p=av2[rnd(0,av2.length-1)];G.ownedAv.push(p.id);G.avatar=p.id;msg='获得头像 '+(p.id+1)}
else{var g3=rnd(200,300);G.gold+=g3;msg='获得 ◈ '+g3}}
SFX.coin();save();
var d=document.createElement('div');d.className='mask';
d.innerHTML='<div class="dlg"><h2 style="color:#f0dca8">抽 到 了</h2><p style="font-size:16px;color:#ffeec2">'+msg+'</p>'
+'<button class="dbtn" data-a="closeDlg">收下</button></div>';
document.body.appendChild(d);
render();
}
function renderDex(){
var body='';
if(DEXTAB==='c'){
var ks=Object.keys(CARDS).filter(function(k){return k!=='whisper'});
body='<div class="dg">'+ks.map(function(k){
var c=CARDS[k];var got=G.dexC[k];
return '<div class="dc'+(got?'':' lock')+'">'
+'<div style="color:'+QC[c.q]+';font-size:11px">'+(got?c.n:'？？？')+'</div>'
+'<div class="dd">'+(got?QN[c.q]:'未获得')+'</div></div>'
}).join('')+'</div>';
}else{
var all=[];
for(var i=0;i<FOES.length;i++)all.push(FOES[i]);
for(var k2 in BOSSES)all.push(BOSSES[k2]);
body='<div class="dg">'+all.map(function(f){
var got=G.dexF[f.n];
return '<div class="dc'+(got?'':' lock')+'">'
+'<div style="display:flex;gap:4px">'+(got?'<i style="width:5px;height:5px;border-radius:50%;background:#ffdc96;box-shadow:0 0 6px #f0c050"></i><i style="width:5px;height:5px;border-radius:50%;background:#ffdc96;box-shadow:0 0 6px #f0c050"></i>':'<i style="width:5px;height:5px;border-radius:50%;background:#333"></i>')+'</div>'
+'<div class="dn">'+(got?f.n:'？？？')+'</div>'
+'<div class="dd">'+(got?PV[f.pv].n:'未遭遇')+'</div></div>'
}).join('')+'</div>';
}
$('app').innerHTML='<div class="pg"><div class="hd"><button class="bk" data-a="toHome">←</button>'
+'<div class="tt">图 鉴</div></div>'
+'<div class="tabs"><button class="tab'+(DEXTAB==='c'?' on':'')+'" data-a="dexC">卡牌</button>'
+'<button class="tab'+(DEXTAB==='f'?' on':'')+'" data-a="dexF">怪物</button></div>'
+body+'</div>';
}
function renderSettings(){
$('app').innerHTML='<div class="pg"><div class="hd"><button class="bk" data-a="toHome">←</button>'
+'<div class="tt">设 置</div></div>'
+'<div class="sheet"><div class="sr"><div><div>昵称</div><div class="dm">'+G.nick+'</div></div>'
+'<button class="sm" data-a="nick">修改</button></div></div>'
+'<div class="sheet"><div class="sr"><div><div>音效</div><div class="dm">出牌、命中、低语</div></div>'
+'<button class="sm'+(G.sfx?' on':'')+'" data-a="toggleSfx">'+(G.sfx?'开':'关')+'</button></div></div>'
+'<div class="sheet"><div class="sr"><div><div>守夜人纪录</div></div><b>'+G.nwBest+' 夜</b></div>'
+'<div class="sr"><div><div>最高层数</div></div><b>第 '+G.best+' 层</b></div></div>'
+'<div class="sheet"><div class="sr" data-a="contact"><div><div>提意见 / 找作者</div>'
+'<div class="dm">2797800498@qq.com</div></div><b style="color:#f0dca8">写信</b></div></div>'
+'<div class="sheet"><div class="sr"><div><div style="color:#e08a5a">清空存档</div>'
+'<div class="dm">所有进度会消失</div></div><button class="sm" data-a="reset" style="color:#e08a5a">清空</button></div></div>'
+'<div style="text-align:center;font-size:9px;color:#4e4a58;letter-spacing:.2em;margin-top:12px">v1.0 · THE LAST VIGIL</div></div>';
}
function renderSign(){
var can=(G.lastSign!==today());
var rw=[20,25,30,35,40,50,100];
var cells='';
for(var i=0;i<7;i++){
var got=i<G.signDays;
var isT=(i===G.signDays&&can);
cells+='<div class="db'+(got?' got':'')+(isT?' td':'')+'">'
+'<div>第 '+(i+1)+' 天</div><b>◈ '+rw[i]+'</b><div>'+((got)?'已领':'')+'</div></div>';
}
$('app').innerHTML='<div class="pg"><div class="hd"><button class="bk" data-a="toHome">←</button>'
+'<div class="tt">签 到</div></div>'
+'<div class="sheet"><div style="text-align:center;font-size:12px;color:#a8a2b6;margin-bottom:6px">'
+'连续第 '+(G.signDays%7||0)+' 天</div>'
+'<div class="sr2">'+cells+'</div></div>'
+'<button class="btn'+(can?' gold':' dis')+'" data-a="doSign">'+(can?'领 取':'今 天 已 领')+'</button></div>';
}
function showHelpDlg(){
var d=document.createElement('div');d.className='mask';
d.innerHTML='<div class="dlg"><h2>怎 么 玩</h2>'
+'<div style="font-size:11.5px;color:#a8a2b6;line-height:2;margin-top:12px">'
+'<b style="color:#ffeec2">① 生命</b>　归零就死。<br>'
+'<b style="color:#ffeec2">② 理智 SAN</b>　第二条命。低于 35 抽到「低语」，归零掉血。<br>'
+'<b style="color:#ffeec2">③ 抽牌/能量</b>　每回合抽 5 张，能量 3 点。<br>'
+'<b style="color:#ffeec2">④ 连锁</b>　同类型连打，伤害 ×1.6 → ×2.2 → ×2.9。<br>'
+'<b style="color:#ffeec2">⑤ 破绽</b>　对应类型打伤害翻倍。<br>'
+'<b style="color:#ffeec2">⑥ 蓄力</b>　怪物每 4 回合蓄力，下回合 1.8 倍重击。<br>'
+'<b style="color:#ffeec2">⑦ 选牌</b>　过关选的牌永久进牌堆。</div>'
+'<button class="dbtn" data-a="closeDlg">知道了</button></div>';
document.body.appendChild(d);
}
document.addEventListener('click',function(e){
ac();
var w=e.target.closest('[data-w]');
if(w&&VIEW==='level'){
var id=w.getAttribute('data-w');var wd=null;
for(var i=0;i<WEAPONS.length;i++)if(WEAPONS[i].id===id)wd=WEAPONS[i];
if(!wd)return;
G.weapon=id;G.deck=wd.deck.slice();G.pickedWeapon=true;
G.max=44+wHp();G.hp=G.max;
G.deck.forEach(function(k){G.dexC[k]=1});
NW=null;save();go('map');return;
}
var t=e.target.closest('[data-a]');
if(t){
var a=t.getAttribute('data-a');var v=parseInt(t.getAttribute('data-v'),10);
if(a==='toHome'){NW=null;go('home');return}
if(a==='toLevel'){go('level');return}
if(a==='go'){startFloor(G.best+1);return}
if(a==='night'){startNight();return}
if(a==='shop'){go('shop');return}
if(a==='gacha'){go('gacha');return}
if(a==='dex'){go('dex');return}
if(a==='settings'){go('settings');return}
if(a==='sign'){go('sign');return}
if(a==='dexC'){DEXTAB='c';render();return}
if(a==='dexF'){DEXTAB='f';render();return}
if(a==='help'){showHelpDlg();return}
if(a==='closeDlg'){var mm=t.closest('.mask');if(mm)mm.remove();return}
if(a==='end'){endTurn();return}
if(a==='pick'){pickCard(v);return}
if(a==='toReward'){PICKS=rollR();rollRelic();go('reward');return}
if(a==='skip'){if(RELIC)G.relics.push(RELIC);PICKS=null;RELIC=null;save();
 if(NW)nextNight();else go('map');return}
if(a==='contact'){location.href='mailto:2797800498@qq.com?subject=%E5%AE%88%E5%A4%9C%E4%BA%BA%E5%8F%8D%E9%A6%88';return}
if(a==='tutNext'){tutClear();TUTI++;tutShow();return}
if(a==='tutSkip'){tutClear();G.tutDone=true;save();return}
if(a==='avBuy'){
for(var i2=0;i2<AVATARS.length;i2++){if(AVATARS[i2].id===v){
if(G.gold<AVATARS[i2].p){toast('金币不足');return}
G.gold-=AVATARS[i2].p;G.ownedAv.push(v);G.avatar=v;SFX.coin();save();render();return;}}
return;
}
if(a==='avUse'){G.avatar=v;save();render();return}
if(a==='buyTicket'){
if(G.gold<200){toast('金币不足');return}
G.gold-=200;G.tickets++;SFX.coin();save();render();return;
}
if(a==='pull'){doPull();return}
if(a==='toggleSfx'){G.sfx=!G.sfx;save();render();return}
if(a==='nick'){
var nn=prompt('输入新昵称（最多 6 字）',G.nick);
if(nn&&nn.trim()){G.nick=nn.trim().slice(0,6);save();render()}
return;
}
if(a==='doSign'){
if(G.lastSign===today()){toast('今天已经签过了');return}
var rw=[20,25,30,35,40,50,100][G.signDays%7]||20;
G.gold+=rw;G.lastSign=today();G.signDays++;
SFX.coin();save();render();toast('签到成功 · +'+rw+' 金币');return;
}
if(a==='flee'){
var d=document.createElement('div');d.className='mask';
d.innerHTML='<div class="dlg"><h2>离开？</h2><p>这一层作废，进度保留。</p>'
+'<button class="dbtn" data-a="fleeYes">离开</button><button class="dbtn2" data-a="closeDlg">继续打</button></div>';
document.body.appendChild(d);return;
}
if(a==='fleeYes'){B=null;NW=null;var m3=t.closest('.mask');if(m3)m3.remove();go('home');return}
if(a==='reset'){
var d2=document.createElement('div');d2.className='mask';
d2.innerHTML='<div class="dlg"><h2>清空全部进度？</h2><p>无法恢复。</p>'
+'<button class="dbtn" data-a="resetYes" style="background:linear-gradient(#a85a4a,#6a2a20);color:#fff">确认清空</button>'
+'<button class="dbtn2" data-a="closeDlg">取消</button></div>';
document.body.appendChild(d2);return;
}
if(a==='resetYes'){G=DEF();save();var m4=t.closest('.mask');if(m4)m4.remove();go('home');return}
}
var fb=e.target.closest('.foe');
if(fb&&VIEW==='fight'&&B){var idx=parseInt(fb.getAttribute('data-f'),10);
if(!B.foes[idx].dead&&!B.lock){B.target=idx;render()}return}
var c=e.target.closest('.card');
if(c&&VIEW==='fight'){playCard(parseInt(c.dataset.i,10));return}
});
render();
</script>
</body>
